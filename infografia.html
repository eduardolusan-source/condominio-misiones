<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1d3f63">
<title>Infografía · Las Misiones Residencial</title>
<link rel="icon" href="assets/mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Página de apoyo de la mesa directiva: arma la infografía del mes con las
     cifras AGREGADAS del Apps Script y la comparte a WhatsApp con un toque.
     ?tipo=cuotas|avance|agua|aguadeuda  &mes=2026-10  &estilo=1…5 (sin estilo: rota cada mes)
     Cada imagen dice arriba a qué periodo se refiere: «cierre de octubre» o «avance al 12 de noviembre».
     Los meses futuros (pagos adelantados) no se muestran como mes. */
  :root { --page: #f8f7f3; --surface: #fdfcf9; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781; --border: rgba(11,11,11,.1); --accent: #1d3f63; }
  @media (prefers-color-scheme: dark) { :root { --page: #0d0d0d; --surface: #1a1a19; --ink: #fff; --ink-2: #c3c2b7; --muted: #898781; --border: rgba(255,255,255,.1); --accent: #9dc0e0; } }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--page); color: var(--ink); }
  main { max-width: 560px; margin: 0 auto; padding: 14px 16px 40px; }
  h1 { font-family: Fredoka, system-ui, sans-serif; font-weight: 600; font-size: 1.35rem; margin: 6px 0 2px; }
  .sub { color: var(--ink-2); font-size: .9rem; margin: 0 0 12px; }
  .lienzo { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 10px; }
  .lienzo svg, .lienzo img { display: block; width: 100%; height: auto; border-radius: 10px; }
  .grupo { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 0; }
  .grupo span { width: 100%; font-size: .78rem; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
  .grupo button, select { font: inherit; font-size: .92rem; font-weight: 600; padding: .5rem .95rem; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); min-height: 42px; cursor: pointer; }
  .grupo button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .grupo button.on { color: #0d0d0d; } }
  .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
  .acciones button { font: inherit; font-weight: 700; font-size: 1rem; border: 0; border-radius: 14px; padding: .95rem; min-height: 54px; cursor: pointer; }
  #compartir { background: #25d366; color: #fff; }
  #descargar { background: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { #descargar { color: #0d0d0d; } }
  .nota { font-size: .82rem; color: var(--muted); margin-top: 12px; line-height: 1.5; }
  #estado { font-size: .85rem; color: var(--ink-2); min-height: 1.2em; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>Infografía del mes</h1>
  <p class="sub" id="sub">Cargando cifras…</p>
  <div class="lienzo" id="lienzo"></div>
  <div class="grupo" id="gTipo"><span>Qué contar</span><button data-tipo="cuotas">Cierre del mes: quién pagó</button><button data-tipo="avance">Avance del mes en curso</button><button data-tipo="agua">¿Alcanzó para el agua?</button><button data-tipo="aguadeuda">Agua por pagar</button></div>
  <div class="grupo" id="gEstilo"><span>Estilo</span></div>
  <div class="grupo"><span>Mes</span><select id="selMes" aria-label="Mes"></select></div>
  <div class="acciones"><button id="compartir" type="button">Compartir a WhatsApp</button><button id="descargar" type="button">Descargar imagen</button></div>
  <p id="estado" role="status"></p>
  <p class="nota">Solo cifras agregadas. Las ventanas, casas, buzones, macetas, monedas, garrafones y llaves no corresponden a departamentos reales: su lugar cambia cada mes al azar.</p>
</main>

<script src="js/data.js?v=20261112"></script>
<script>
(function () {
  "use strict";
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0qO7rHUmBqUJOuwjBkYIu4O8_FrWlC8f_DyLj3DrhN1h5ApHpdfKVmUgx_aVH3aJ-/exec";
  const W = 1080, H = 1350;
  const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  const q = new URLSearchParams(location.search);
  const estado = { tipo: ["agua", "aguadeuda", "avance"].indexOf(q.get("tipo")) >= 0 ? q.get("tipo") : "cuotas", mes: q.get("mes") || "", estilo: +q.get("estilo") || 0 };
  let meses = [], aguaCobro = [], fuenteFont = "", logoClaro = "", logoOscuro = "", cuota = MISIONES.cuota;
  const HOY = new Date();
  let hoyId = HOY.getFullYear() + "-" + String(HOY.getMonth() + 1).padStart(2, "0");
  let PERIODO = "", ANIMAR = true;      // etiqueta de arriba y animación (solo en pantalla; la imagen sale quieta)

  const $ = v => (v < 0 ? "−$" : "$") + Math.round(Math.abs(v)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

  /* Azar con semilla: el mismo mes siempre da el mismo acomodo, otro mes da otro. */
  function azar(semilla) {
    let h = 2166136261;
    for (const c of String(semilla)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
    return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function barajar(arr, r) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  /* ---------------- Datos ---------------- */
  function normal(m, vivo) {
    const ord = (m.detalle && m.detalle.ordinarios) || [];
    return {
      id: m.id, nombre: MESES[parseInt(m.id.slice(5), 10) - 1], anio: m.id.slice(0, 4), vivo: vivo,
      pagaron: Number(m.cobranza && m.cobranza.pagaron) || 0, unidades: MISIONES.unidades,
      manto: Number(m.ingresos && m.ingresos.manto) || 0,
      mora: m.mora || null,
      aguaCobrada: Number(m.ingresos && m.ingresos.agua) || 0,
      aguaRecibo: ord.filter(it => /^agua/i.test(it[0])).reduce((a, it) => a + Number(it[1] || 0), 0)
    };
  }
  async function cargar() {
    meses = MISIONES.meses.map(m => normal(m, false));
    try {
      const r = await fetch(SCRIPT_URL + "?accion=finanzas&t=" + Date.now(), { cache: "no-store" });
      const j = await r.json();
      if (j && j.ok && /^\d{4}-\d{2}$/.test(j.hoy || "")) hoyId = j.hoy;
      if (j && j.ok && Number(j.cuota) > 0) cuota = Number(j.cuota);
      if (j && j.ok && Array.isArray(j.aguaCobro)) aguaCobro = j.aguaCobro.map(a => ({
        id: a.mesAgua, nombre: MESES[parseInt(a.mesAgua.slice(5), 10) - 1], anio: a.mesAgua.slice(0, 4), vivo: true,
        cargados: a.cargados, pagados: a.pagados, pendientes: a.pendientes, montoPendiente: a.montoPendiente, montoCargado: a.montoCargado })).sort((a, b) => a.id.localeCompare(b.id));
      if (j && j.ok) (j.meses || []).forEach(m => {
        const n = normal(m, true), i = meses.findIndex(x => x.id === n.id);
        if (i >= 0) meses[i] = n; else meses.push(n);
      });
    } catch (e) { console.warn("[Infografía] Sin hoja en vivo: " + e.message); }
    meses = meses.filter(m => m.id <= hoyId).sort((a, b) => a.id.localeCompare(b.id));   // nada de meses futuros
  }

  /* Fuente y logos incrustados para que la imagen exportada se vea igual. */
  async function incrustar() {
    try {
      const css = await (await fetch("https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap")).text();
      const bloques = css.split("@font-face").filter(b => /U\+0000-00FF/.test(b));
      const url = /url\((https:[^)]+)\)/.exec(bloques[0] || css)[1];
      const buf = await (await fetch(url)).arrayBuffer();
      let bin = ""; new Uint8Array(buf).forEach(b => { bin += String.fromCharCode(b); });
      fuenteFont = "@font-face{font-family:'FredokaX';font-weight:600;src:url(data:font/woff2;base64," + btoa(bin) + ") format('woff2');}";
    } catch (e) { console.warn("[Infografía] Sin fuente incrustada: " + e.message); }
    const svg64 = async ruta => { try { const t = await (await fetch(ruta)).text(); return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(t))); } catch (e) { return ""; } };
    logoClaro = await svg64("assets/logo.svg");
    logoOscuro = await svg64("assets/logo-dark.svg");
  }

  /* ---------------- Piezas comunes ---------------- */
  const F = "font-family=\"FredokaX, Fredoka, 'Arial Rounded MT Bold', system-ui, sans-serif\" font-weight=\"600\"";
  function marco(fondo, contenido, oscuro) {
    return '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '">' +
      "<defs><style>" + fuenteFont + "</style>" +
      '<marker id="punta" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f07a62"/></marker></defs>' +
      fondo + (PERIODO ? '<text x="' + W / 2 + '" y="44" text-anchor="middle" ' + F + ' font-size="30" letter-spacing="3" fill="' + (oscuro ? "#f3ead8" : "#24304a") + '" opacity=".8">' + esc(PERIODO.toUpperCase()) + "</text>" : "") + contenido +
      ((oscuro ? logoOscuro : logoClaro) ? '<image href="' + (oscuro ? logoOscuro : logoClaro) + '" x="' + (W / 2 - 100) + '" y="' + (H - 112) + '" width="200" height="92" preserveAspectRatio="xMidYMid meet"/>'
        : '<text x="' + W / 2 + '" y="' + (H - 80) + '" text-anchor="middle" ' + F + ' font-size="40" fill="' + (oscuro ? "#f3ead8" : "#1d3f63") + '">Las Misiones</text>') +
      "</svg>";
  }
  function titulo(l1, l2, color, y) {
    y = (y || 150) + 14;
    return '<text x="' + W / 2 + '" y="' + y + '" text-anchor="middle" ' + F + ' font-size="104" fill="' + color + '">' + esc(l1) + "</text>" +
      '<text x="' + W / 2 + '" y="' + (y + 112) + '" text-anchor="middle" ' + F + ' font-size="104" fill="' + color + '">' + esc(l2) + "</text>";
  }
  function barra(y, pct, cLleno, cResto, colorTexto, colorTexto2, x, w) {
    x = x || 160; w = w || 760;
    const p = Math.max(0, Math.min(1, pct)), lw = Math.round(w * p);
    return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="66" rx="16" fill="' + cResto + '" stroke="#0b0b0b" stroke-opacity=".15" stroke-width="3"/>' +
      (lw > 0 ? '<rect x="' + x + '" y="' + y + '" width="' + lw + '" height="66" rx="16" fill="' + cLleno + '"/>' : "") +
      (p >= 0.18 ? '<text x="' + (x + lw / 2) + '" y="' + (y + 47) + '" text-anchor="middle" ' + F + ' font-size="42" fill="' + colorTexto + '">' + Math.round(p * 100) + " %</text>" : "") +
      (p <= 0.82 ? '<text x="' + (x + lw + (w - lw) / 2) + '" y="' + (y + 47) + '" text-anchor="middle" ' + F + ' font-size="42" fill="' + colorTexto2 + '">' + Math.round((1 - p) * 100) + " %</text>" : "");
  }
  function etiqueta(x, y, n, palabra, color, tam) {
    tam = tam || 60;
    return '<text x="' + x + '" y="' + y + '" text-anchor="middle" ' + F + ' font-size="' + tam + '" fill="' + color + '">' + n + "</text>" +
      '<text x="' + x + '" y="' + (y + tam * 0.85) + '" text-anchor="middle" ' + F + ' font-size="' + Math.round(tam * 0.72) + '" fill="' + color + '">' + esc(palabra) + "</text>";
  }
  const flecha = d => '<path d="' + d + '" fill="none" stroke="#f07a62" stroke-width="7" stroke-linecap="round" marker-end="url(#punta)"/>';
  function pieMora(m, y, color) {
    if (!m.mora) return "";
    const t = m.mora.acumulada > 0.5 ? "Cuotas atrasadas: " + $(m.mora.acumulada) + " · " + m.mora.unidades + (m.mora.unidades === 1 ? " depto" : " deptos") : "¡Nadie tiene cuotas atrasadas!";
    return '<text x="' + W / 2 + '" y="' + y + '" text-anchor="middle" ' + F + ' font-size="38" fill="' + color + '">' + esc(t) + "</text>";
  }

  /* Adornos de ventana encendida */
  function adorno(tipo, x, y, w, h) {
    const b = y + h - 6, cx = x + w / 2;
    if (tipo === 0) return '<rect x="' + (cx - 18) + '" y="' + (b - 30) + '" width="36" height="30" rx="4" fill="#e8735a"/><ellipse cx="' + (cx - 12) + '" cy="' + (b - 46) + '" rx="9" ry="20" fill="#5c9e5a" transform="rotate(-20 ' + (cx - 12) + " " + (b - 46) + ')"/><ellipse cx="' + (cx + 12) + '" cy="' + (b - 46) + '" rx="9" ry="20" fill="#4b8a4a" transform="rotate(20 ' + (cx + 12) + " " + (b - 46) + ')"/><ellipse cx="' + cx + '" cy="' + (b - 54) + '" rx="8" ry="22" fill="#6bb067"/>';
    if (tipo === 1) return '<line x1="' + (cx + 14) + '" y1="' + (b - 40) + '" x2="' + (cx + 14) + '" y2="' + b + '" stroke="#3a3a3a" stroke-width="4"/><path d="M' + (cx - 6) + " " + (b - 40) + " L" + (cx + 34) + " " + (b - 40) + " L" + (cx + 26) + " " + (b - 66) + " L" + (cx + 2) + " " + (b - 66) + ' Z" fill="#e8735a"/>';
    if (tipo === 2) return '<path d="M' + (cx - 22) + " " + b + " q-4 -34 14 -40 l-6 -14 l10 8 l8 -8 l-2 16 q18 10 12 38 Z\" fill=\"#3b3f55\"/><path d=\"M" + (cx + 14) + " " + (b - 4) + " q22 -2 18 -22\" stroke=\"#3b3f55\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/>";
    if (tipo === 3) return '<line x1="' + cx + '" y1="' + (y + 8) + '" x2="' + cx + '" y2="' + (y + 40) + '" stroke="#3a3a3a" stroke-width="3"/><path d="M' + (cx - 20) + " " + (y + 58) + " Q" + cx + " " + (y + 30) + " " + (cx + 20) + " " + (y + 58) + ' Z" fill="#3b3f55"/><circle cx="' + cx + '" cy="' + (y + 62) + '" r="7" fill="#fff6c8"/>';
    if (tipo === 4) return '<circle cx="' + (cx - 4) + '" cy="' + (b - 58) + '" r="15" fill="#3b3f55"/><path d="M' + (cx - 30) + " " + b + " q0 -40 26 -40 q26 0 26 40 Z\" fill=\"#3b3f55\"/>";
    return '<path d="M' + (x + 8) + " " + (y + 8) + " Q" + (x + 34) + " " + (y + h / 2) + " " + (x + 8) + " " + (b) + ' Z" fill="#f2a65a" opacity=".85"/><path d="M' + (x + w - 8) + " " + (y + 8) + " Q" + (x + w - 34) + " " + (y + h / 2) + " " + (x + w - 8) + " " + b + ' Z" fill="#f2a65a" opacity=".85"/>';
  }

  /* ---------------- CUOTAS ---------------- */
  /* 1 · Edificio de noche: ventana encendida = pagó. */
  function cuotasEdificio(m, r) {
    const N = m.unidades, pag = Math.min(m.pagaron, N);
    const lugares = barajar([...Array(N).keys()], r), encendida = new Set(lugares.slice(0, pag));
    /* Las flechas apuntan a la columna derecha: ahí debe haber al menos una
       ventana encendida y una apagada (se intercambia con otra al azar). */
    const derecha = [...Array(N).keys()].filter(i => i % 4 === 3);
    if (pag > 0 && pag < N) {
      if (!derecha.some(i => encendida.has(i))) { const de = [...encendida][0]; encendida.delete(de); encendida.add(derecha[Math.floor(r() * derecha.length)]); }
      if (!derecha.some(i => !encendida.has(i))) { const a = derecha[Math.floor(r() * derecha.length)]; const libre = [...Array(N).keys()].find(i => !encendida.has(i)); encendida.delete(a); encendida.add(libre); }
    }
    let estrellas = "";
    for (let i = 0; i < 26; i++) estrellas += '<circle cx="' + Math.round(r() * W) + '" cy="' + Math.round(40 + r() * 240) + '" r="' + (2 + r() * 3).toFixed(1) + '" fill="#f3ead8" opacity="' + (0.5 + r() * 0.5).toFixed(2) + '"/>';
    const bx = 170, by = 320, bw = 620, bh = 680, cols = 4, filas = Math.ceil(N / cols);
    const vw = 106, vh = 128, gx = (bw - cols * vw) / (cols + 1), gy = (bh - 40 - filas * vh) / (filas + 1);
    let v = "", encendidasDer = [], apagadas = [];
    for (let i = 0; i < N; i++) {
      const c = i % cols, f = Math.floor(i / cols);
      const x = bx + gx + c * (vw + gx), y = by + 40 + gy + f * (vh + gy);
      const on = encendida.has(i);
      v += '<rect x="' + (x - 6) + '" y="' + (y - 6) + '" width="' + (vw + 12) + '" height="' + (vh + 12) + '" rx="6" fill="#fdfaf2" stroke="#1b2238" stroke-width="5"/>' +
        '<rect x="' + x + '" y="' + y + '" width="' + vw + '" height="' + vh + '" fill="' + (on ? "#ffcb45" : "#2b3452") + '"/>' +
        (on ? '<rect x="' + x + '" y="' + y + '" width="' + vw + '" height="' + vh + '" fill="#ffe08a" opacity=".55"/>' + adorno(Math.floor(r() * 6), x, y, vw, vh) : "") +
        '<line x1="' + (x + vw / 2) + '" y1="' + y + '" x2="' + (x + vw / 2) + '" y2="' + (y + vh) + '" stroke="#1b2238" stroke-width="4"/><line x1="' + x + '" y1="' + (y + vh * 0.38) + '" x2="' + (x + vw) + '" y2="' + (y + vh * 0.38) + '" stroke="#1b2238" stroke-width="4"/>' +
        '<rect x="' + (x - 12) + '" y="' + (y + vh + 4) + '" width="' + (vw + 24) + '" height="14" rx="4" fill="' + (on ? "#fdfaf2" : "#3a4466") + '" stroke="#1b2238" stroke-width="4"/>';
      if (c === cols - 1) (on ? encendidasDer : apagadas).push([x + vw + 10, y + vh / 2]);
    }
    /* Etiquetas a la derecha, a la altura de sus ventanas y sin encimarse. */
    const lx = 965;
    let yPag = encendidasDer.length ? encendidasDer[0][1] - 20 : by + 120;
    /* "faltan" apunta a la ventana apagada de la columna derecha más lejana de "pagaron". */
    if (apagadas.length > 1 && encendidasDer.length) apagadas.sort((p, q) => Math.abs(q[1] - encendidasDer[0][1]) - Math.abs(p[1] - encendidasDer[0][1]));
    let yFal = apagadas.length ? apagadas[0][1] - 20 : by + 460;
    if (Math.abs(yFal - yPag) < 180) { if (yFal >= yPag) yFal = yPag + 180; else yPag = yFal + 180; }
    if (yFal > by + bh - 60) { yFal = by + bh - 60; if (Math.abs(yFal - yPag) < 180) yPag = yFal - 180; }
    const curva = (x1, y1, p) => flecha("M" + x1 + " " + y1 + " Q" + (x1 - 20) + " " + ((y1 + p[1]) / 2 + (p[1] > y1 ? -30 : 30)) + " " + p[0] + " " + p[1]);
    let flechas = pag && encendidasDer.length ? curva(lx - 55, yPag + 10, encendidasDer[0]) : "";
    if (apagadas.length) flechas += curva(lx - 45, yFal + 10, apagadas[0]);
    const fondo = '<rect width="' + W + '" height="' + H + '" fill="#1d2b4c"/>' + estrellas +
      '<path d="M150 108 a52 52 0 1 0 60 68 a42 42 0 1 1 -60 -68 Z" fill="#f3ead8"/>';
    const edificio = '<rect x="' + (bx - 22) + '" y="' + (by - 26) + '" width="' + (bw + 44) + '" height="34" rx="6" fill="#f3ead8" stroke="#1b2238" stroke-width="6"/><rect x="' + (bx + 50) + '" y="' + (by - 58) + '" width="86" height="34" fill="#f3ead8" stroke="#1b2238" stroke-width="6"/>' +
      '<rect x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + bh + '" fill="#f3ead8" stroke="#1b2238" stroke-width="6"/>' +
      '<line x1="' + (bx - 40) + '" y1="' + (by + bh) + '" x2="' + (bx + bw + 40) + '" y2="' + (by + bh) + '" stroke="#1b2238" stroke-width="6"/>';
    return marco(fondo, titulo("Mantenimiento", "de " + m.nombre, "#f3ead8", 128) + edificio + v + flechas +
      etiqueta(lx, yPag, pag, "pagaron", "#f3ead8") + (N - pag ? etiqueta(lx, yFal, N - pag, N - pag === 1 ? "falta" : "faltan", "#f3ead8") : "") +
      barra(by + bh + 40, pag / N, "#ffcb45", "#2b3452", "#1d2b4c", "#f3ead8") +
      '<text x="' + W / 2 + '" y="' + (by + bh + 160) + '" text-anchor="middle" ' + F + ' font-size="48" fill="#f3ead8">' + pag + " de " + N + " departamentos</text>" +
      pieMora(m, by + bh + 210, "#c9d6ee"), true);
  }

  /* 2 · Calle de casitas de día: casita con banderín = pagó. */
  function cuotasCasitas(m, r) {
    const N = m.unidades, pag = Math.min(m.pagaron, N);
    const lugares = barajar([...Array(N).keys()], r), ok = new Set(lugares.slice(0, pag));
    const techos = ["#e8735a", "#f2a65a", "#5c9e5a", "#2f7fb5", "#9b6bc4", "#e5b93a"];
    const fondo = '<defs><linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3f7"/><stop offset="1" stop-color="#eaf6fc"/></linearGradient></defs>' +
      '<rect width="' + W + '" height="' + H + '" fill="url(#cielo)"/><circle cx="1010" cy="60" r="70" fill="#ffd45c"/><circle cx="1010" cy="60" r="100" fill="#ffd45c" opacity=".25"/>' +
      '<ellipse cx="200" cy="300" rx="110" ry="34" fill="#fff" opacity=".9"/><ellipse cx="270" cy="280" rx="70" ry="30" fill="#fff" opacity=".9"/>' +
      '<path d="M0 1010 Q270 940 540 1000 T1080 990 V1350 H0 Z" fill="#8cc97a"/><path d="M0 1060 Q300 1010 600 1060 T1080 1050 V1350 H0 Z" fill="#74b865"/>';
    const cols = 4, cw = 200, ch = 150, x0 = (W - cols * cw) / 2;
    let casas = "";
    for (let i = 0; i < N; i++) {
      const c = i % cols, f = Math.floor(i / cols);
      const x = x0 + c * cw + 20, y = 360 + f * 160, w = cw - 40, on = ok.has(i);
      const techo = on ? techos[Math.floor(r() * techos.length)] : "#b9b6ad";
      casas += '<rect x="' + x + '" y="' + (y + 50) + '" width="' + w + '" height="' + (ch - 60) + '" rx="6" fill="' + (on ? "#fffaf0" : "#e4e1d8") + '" stroke="#24304a" stroke-width="5"/>' +
        '<path d="M' + (x - 12) + " " + (y + 56) + " L" + (x + w / 2) + " " + (y + 4) + " L" + (x + w + 12) + " " + (y + 56) + ' Z" fill="' + techo + '" stroke="#24304a" stroke-width="5" stroke-linejoin="round"/>' +
        '<rect x="' + (x + w / 2 - 16) + '" y="' + (y + ch - 52) + '" width="32" height="42" rx="4" fill="' + (on ? "#2f7fb5" : "#9a978f") + '" stroke="#24304a" stroke-width="4"/>' +
        '<rect x="' + (x + 16) + '" y="' + (y + 66) + '" width="30" height="26" fill="' + (on ? "#ffcb45" : "#c9c6bd") + '" stroke="#24304a" stroke-width="4"/>' +
        '<rect x="' + (x + w - 46) + '" y="' + (y + 66) + '" width="30" height="26" fill="' + (on ? "#ffcb45" : "#c9c6bd") + '" stroke="#24304a" stroke-width="4"/>' +
        (on ? '<line x1="' + (x + w - 10) + '" y1="' + (y + 54) + '" x2="' + (x + w - 10) + '" y2="' + (y - 6) + '" stroke="#24304a" stroke-width="4"/><path d="M' + (x + w - 10) + " " + (y - 6) + " l34 10 l-34 10 Z\" fill=\"#3fae5a\"/>"
          : '<text x="' + (x + w / 2) + '" y="' + (y + 46) + '" text-anchor="middle" ' + F + ' font-size="34" fill="#6b685f">?</text>');
    }
    return marco(fondo, titulo("Mantenimiento", "de " + m.nombre, "#1d3f63", 128) + casas +
      '<rect x="120" y="1018" width="840" height="92" rx="46" fill="#fffaf0" stroke="#24304a" stroke-width="5"/>' +
      '<text x="' + W / 2 + '" y="1080" text-anchor="middle" ' + F + ' font-size="46" fill="#1d3f63">' + pag + " al corriente · " + (N - pag) + " pendientes</text>" +
      pieMora(m, 1160, "#1d3f63"), false);
  }

  /* 3 · Alcancía de monedas: moneda dentro = pagó. */
  function cuotasMonedas(m, r) {
    const N = m.unidades, pag = Math.min(m.pagaron, N);
    const fondo = '<rect width="' + W + '" height="' + H + '" fill="#fff3d6"/>' +
      [...Array(14)].map(() => '<circle cx="' + Math.round(r() * W) + '" cy="' + Math.round(r() * H) + '" r="' + Math.round(6 + r() * 14) + '" fill="#ffe3a3" opacity=".7"/>').join("");
    const jx = 230, jy = 330, jw = 460, jh = 560;
    let monedas = "";
    for (let i = 0; i < pag; i++) {
      const c = i % 4, f = Math.floor(i / 4);
      const x = jx + 70 + c * 105 + (f % 2 ? 26 : 0) + (r() * 10 - 5), y = jy + jh - 80 - f * 92;
      monedas += '<circle cx="' + x + '" cy="' + y + '" r="44" fill="#f4b43a" stroke="#8a5a12" stroke-width="5"/><circle cx="' + x + '" cy="' + y + '" r="31" fill="none" stroke="#c98a1e" stroke-width="4"/><text x="' + x + '" y="' + (y + 15) + '" text-anchor="middle" ' + F + ' font-size="40" fill="#8a5a12">$</text>';
    }
    let faltan = "";
    for (let i = 0; i < N - pag; i++) {
      const x = 800 + (i % 2) * 104, y = 420 + Math.floor(i / 2) * 104;
      faltan += '<circle cx="' + x + '" cy="' + y + '" r="42" fill="none" stroke="#c98a1e" stroke-width="5" stroke-dasharray="12 9"/>';
    }
    const frasco = '<path d="M' + jx + " " + (jy + 40) + " Q" + jx + " " + jy + " " + (jx + 40) + " " + jy + " L" + (jx + jw - 40) + " " + jy + " Q" + (jx + jw) + " " + jy + " " + (jx + jw) + " " + (jy + 40) + " L" + (jx + jw) + " " + (jy + jh - 30) + " Q" + (jx + jw) + " " + (jy + jh) + " " + (jx + jw - 40) + " " + (jy + jh) + " L" + (jx + 40) + " " + (jy + jh) + " Q" + jx + " " + (jy + jh) + " " + jx + " " + (jy + jh - 30) + ' Z" fill="#ffffff" fill-opacity=".55" stroke="#24304a" stroke-width="7"/>' +
      '<rect x="' + (jx + 40) + '" y="' + (jy - 50) + '" width="' + (jw - 80) + '" height="56" rx="12" fill="#2f7fb5" stroke="#24304a" stroke-width="7"/><rect x="' + (jx + jw / 2 - 60) + '" y="' + (jy - 34) + '" width="120" height="14" rx="7" fill="#24304a"/>';
    return marco(fondo, titulo("Las cuotas", "de " + m.nombre, "#7a4a0c", 128) + monedas + frasco + faltan +
      (N - pag ? '<text x="852" y="' + (420 + Math.ceil((N - pag) / 2) * 104 + 20) + '" text-anchor="middle" ' + F + ' font-size="40" fill="#7a4a0c">faltan ' + (N - pag) + "</text>" : "") +
      '<text x="' + W / 2 + '" y="1000" text-anchor="middle" ' + F + ' font-size="86" fill="#24304a">' + pag + " de " + N + " pagaron</text>" +
      barra(1035, pag / N, "#f4b43a", "#fbe2ad", "#5c3a08", "#7a4a0c") + pieMora(m, 1160, "#7a4a0c"), false);
  }

  /* ---------------- AGUA ---------------- */
  function aguaTextos(m) {
    const pct = m.aguaRecibo ? m.aguaCobrada / m.aguaRecibo : 0;
    const dif = m.aguaCobrada - m.aguaRecibo;
    return { pct: pct, linea1: "Recibo de la CEA: " + $(m.aguaRecibo) + " · cobrado: " + $(m.aguaCobrada),
      linea2: Math.abs(dif) < 1 ? "Alcanzó justo para el recibo" : dif > 0 ? "Alcanzó y sobraron " + $(dif) : "Faltaron " + $(-dif) + " (los puso el mantenimiento)" };
  }

  /* 1 · Tinaco: el agua sube hasta el % cubierto. */
  function aguaTinaco(m, r) {
    const t = aguaTextos(m), p = Math.min(1, t.pct);
    const tx = 300, ty = 330, tw = 480, th = 560, nivel = ty + th - th * p;
    const fondo = '<rect width="' + W + '" height="' + H + '" fill="#e6f3fb"/><path d="M0 1000 H1080 V1350 H0 Z" fill="#cfe6f4"/>' +
      [...Array(10)].map(() => { const x = Math.round(r() * W), y = Math.round(200 + r() * 900); return '<path d="M' + x + " " + y + " q14 22 0 34 q-14 -12 0 -34 Z\" fill=\"#9fd0ee\" opacity=\".6\"/>"; }).join("");
    const tinaco = '<defs><clipPath id="dentro"><rect x="' + tx + '" y="' + ty + '" width="' + tw + '" height="' + th + '" rx="70"/></clipPath></defs>' +
      '<rect x="' + tx + '" y="' + ty + '" width="' + tw + '" height="' + th + '" rx="70" fill="#ffffff" stroke="#24304a" stroke-width="7"/>' +
      '<g clip-path="url(#dentro)"><rect x="' + tx + '" y="' + nivel + '" width="' + tw + '" height="' + (th * p + 10) + '" fill="#3b9be0"/>' +
      '<path d="M' + tx + " " + nivel + " q60 -22 120 0 t120 0 t120 0 t120 0 V" + (nivel + 30) + " H" + tx + ' Z" fill="#6ab8ef"/></g>' +
      '<rect x="' + (tx + 150) + '" y="' + (ty - 46) + '" width="180" height="54" rx="14" fill="#24304a"/>' +
      [0.25, 0.5, 0.75].map(f => '<line x1="' + (tx + tw - 50) + '" y1="' + (ty + th - th * f) + '" x2="' + (tx + tw - 10) + '" y2="' + (ty + th - th * f) + '" stroke="#24304a" stroke-width="4"/>').join("") +
      '<text x="' + (tx + tw / 2) + '" y="' + Math.max(ty + 120, Math.min(ty + th - 40, nivel + 110)) + '" text-anchor="middle" ' + F + ' font-size="120" fill="' + (p > 0.3 ? "#ffffff" : "#1d3f63") + '">' + Math.round(t.pct * 100) + "%</text>";
    return marco(fondo, titulo("El agua", "de " + m.nombre, "#1d3f63", 128) + tinaco +
      '<text x="' + W / 2 + '" y="960" text-anchor="middle" ' + F + ' font-size="44" fill="#1d3f63">del recibo se cubrió con lo cobrado</text>' +
      '<text x="' + W / 2 + '" y="1040" text-anchor="middle" ' + F + ' font-size="36" fill="#24304a">' + esc(t.linea1) + "</text>" +
      '<text x="' + W / 2 + '" y="1095" text-anchor="middle" ' + F + ' font-size="40" fill="' + (t.pct >= 1 ? "#2f7d32" : "#b3261e") + '">' + esc(t.linea2) + "</text>", false);
  }

  /* 2 · Diez gotas: cada una es 10% del recibo. */
  function aguaGotas(m) {
    const t = aguaTextos(m), p = Math.min(1, t.pct);
    const fondo = '<rect width="' + W + '" height="' + H + '" fill="#0f3d5e"/><circle cx="540" cy="640" r="430" fill="#14507a" opacity=".6"/>';
    let gotas = "";
    for (let i = 0; i < 10; i++) {
      const c = i % 5, f = Math.floor(i / 5), x = 180 + c * 180, y = 420 + f * 260;
      const llen = Math.max(0, Math.min(1, p * 10 - i));
      const forma = "M" + x + " " + (y - 90) + " C" + (x + 20) + " " + (y - 50) + " " + (x + 70) + " " + (y - 10) + " " + (x + 70) + " " + (y + 40) + " A70 70 0 0 1 " + (x - 70) + " " + (y + 40) + " C" + (x - 70) + " " + (y - 10) + " " + (x - 20) + " " + (y - 50) + " " + x + " " + (y - 90) + " Z";
      gotas += '<clipPath id="g' + i + '"><path d="' + forma + '"/></clipPath><path d="' + forma + '" fill="#1d5f8d"/>' +
        '<rect x="' + (x - 80) + '" y="' + (y + 112 - 205 * llen) + '" width="160" height="' + (205 * llen) + '" fill="#5ec2ff" clip-path="url(#g' + i + ')"/>' +
        '<path d="' + forma + '" fill="none" stroke="#e6f3fb" stroke-width="6"/>' + (llen > 0.3 ? '<ellipse cx="' + (x - 24) + '" cy="' + (y + 20) + '" rx="10" ry="18" fill="#ffffff" opacity=".6"/>' : "");
    }
    return marco(fondo, titulo("El agua", "de " + m.nombre, "#e6f3fb", 128) + gotas +
      '<text x="' + W / 2 + '" y="940" text-anchor="middle" ' + F + ' font-size="88" fill="#ffffff">' + Math.round(t.pct * 100) + "% del recibo</text>" +
      '<text x="' + W / 2 + '" y="1010" text-anchor="middle" ' + F + ' font-size="36" fill="#cfe6f4">cada gota es el 10% · ' + esc(t.linea1) + "</text>" +
      '<text x="' + W / 2 + '" y="1075" text-anchor="middle" ' + F + ' font-size="40" fill="' + (t.pct >= 1 ? "#9be7a1" : "#ffb4a8") + '">' + esc(t.linea2) + "</text>", true);
  }

  /* 3 · Vaso: lo cobrado contra el tamaño del recibo. */
  function aguaVaso(m, r) {
    const t = aguaTextos(m), p = Math.min(1.15, t.pct);
    const fondo = '<rect width="' + W + '" height="' + H + '" fill="#fdf6ec"/>' +
      [...Array(9)].map(() => '<circle cx="' + Math.round(r() * W) + '" cy="' + Math.round(250 + r() * 800) + '" r="' + Math.round(10 + r() * 22) + '" fill="#d9eefa"/>').join("");
    const top = 340, bot = 900, xtL = 300, xtR = 780, xbL = 360, xbR = 720;
    const y = bot - (bot - top) * Math.min(1, p);
    const lerp = (a, b, f) => a + (b - a) * f, f = (y - top) / (bot - top);
    const vaso = '<path d="M' + lerp(xtL, xbL, f) + " " + y + " L" + lerp(xtR, xbR, f) + " " + y + " L" + xbR + " " + bot + " L" + xbL + " " + bot + ' Z" fill="#4aa8e8"/>' +
      '<path d="M' + lerp(xtL, xbL, f) + " " + y + " q60 -18 120 0 t120 0 t120 0 t120 0\" fill=\"none\" stroke=\"#8fd0fa\" stroke-width=\"8\"/>" +
      '<path d="M' + xtL + " " + top + " L" + xbL + " " + bot + " L" + xbR + " " + bot + " L" + xtR + " " + top + '" fill="none" stroke="#24304a" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<line x1="' + (xtL - 20) + '" y1="' + top + '" x2="' + (xtR + 20) + '" y2="' + top + '" stroke="#b3261e" stroke-width="5" stroke-dasharray="14 10"/>' +
      '<text x="' + (xtR + 30) + '" y="' + (top + 12) + '" ' + F + ' font-size="34" fill="#b3261e">recibo</text>' +
      (t.pct > 1 ? '<path d="M' + (xtR - 10) + " " + (top - 4) + " q30 30 10 70\" fill=\"none\" stroke=\"#4aa8e8\" stroke-width=\"14\" stroke-linecap=\"round\"/>" : "") +
      '<text x="540" y="' + Math.min(bot - 40, y + 100) + '" text-anchor="middle" ' + F + ' font-size="104" fill="' + (p > 0.25 ? "#ffffff" : "#1d3f63") + '">' + Math.round(t.pct * 100) + "%</text>";
    return marco(fondo, titulo("¿Alcanzó", "para el agua?", "#1d3f63", 128) + vaso +
      '<text x="' + W / 2 + '" y="980" text-anchor="middle" ' + F + ' font-size="40" fill="#24304a">' + esc(m.nombre.charAt(0).toUpperCase() + m.nombre.slice(1)) + ": " + esc(t.linea1.replace("Recibo de la CEA", "recibo")) + "</text>" +
      '<text x="' + W / 2 + '" y="1050" text-anchor="middle" ' + F + ' font-size="44" fill="' + (t.pct >= 1 ? "#2f7d32" : "#b3261e") + '">' + esc(t.linea2) + "</text>", false);
  }

  /* 4 · Buzones del edificio: sobre en el buzón = pagó. */
  function cuotasBuzones(m, r) {
    const N = m.unidades, pag = Math.min(m.pagaron, N);
    const ok = new Set(barajar([...Array(N).keys()], r).slice(0, pag));
    const fondo = '<rect width="' + W + '" height="' + H + '" fill="#efe4d2"/>' +
      [...Array(12)].map((_, i) => '<rect x="' + ((i % 4) * 280 - 40 + (Math.floor(i / 4) % 2) * 140) + '" y="' + (300 + Math.floor(i / 4) * 330) + '" width="260" height="8" rx="4" fill="#e3d4bb"/>').join("");
    const px = 170, py = 300, pw = 740, ph = 640, cols = 4, filas = Math.ceil(N / cols);
    const bw = 150, bh = 120, gx = (pw - cols * bw) / (cols + 1), gy = (ph - filas * bh) / (filas + 1);
    let b = '<rect x="' + px + '" y="' + py + '" width="' + pw + '" height="' + ph + '" rx="22" fill="#b9873f" stroke="#5a3d16" stroke-width="7"/>' +
      '<rect x="' + (px + 14) + '" y="' + (py + 14) + '" width="' + (pw - 28) + '" height="' + (ph - 28) + '" rx="14" fill="#d1a257"/>';
    for (let i = 0; i < N; i++) {
      const c = i % cols, f = Math.floor(i / cols), x = px + gx + c * (bw + gx), y = py + gy + f * (bh + gy), on = ok.has(i);
      b += '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + bh + '" rx="10" fill="#e9c27a" stroke="#5a3d16" stroke-width="5"/>' +
        '<rect x="' + (x + 22) + '" y="' + (y + 22) + '" width="' + (bw - 44) + '" height="14" rx="7" fill="#3b2a12"/>' +
        '<circle cx="' + (x + bw - 26) + '" cy="' + (y + bh - 26) + '" r="9" fill="#5a3d16"/>';
      if (on) b += '<g transform="rotate(' + (r() * 16 - 8).toFixed(1) + " " + (x + bw / 2) + " " + (y + 20) + ')"><rect x="' + (x + 30) + '" y="' + (y - 18) + '" width="' + (bw - 60) + '" height="58" rx="5" fill="#ffffff" stroke="#5a3d16" stroke-width="4"/>' +
        '<path d="M' + (x + 30) + " " + (y - 18) + " L" + (x + bw / 2) + " " + (y + 12) + " L" + (x + bw - 30) + " " + (y - 18) + '" fill="none" stroke="#5a3d16" stroke-width="4"/><circle cx="' + (x + bw / 2) + '" cy="' + (y + 18) + '" r="11" fill="#3fae5a"/></g>';
      else b += '<text x="' + (x + bw / 2) + '" y="' + (y + 88) + '" text-anchor="middle" ' + F + ' font-size="34" fill="#7a5a2a" opacity=".55">vacío</text>';
    }
    return marco(fondo, titulo("Mantenimiento", "de " + m.nombre, "#5a3d16", 128) + b +
      '<text x="' + W / 2 + '" y="1020" text-anchor="middle" ' + F + ' font-size="62" fill="#3b2a12">' + pag + " pagaron · " + (N - pag) + " faltan</text>" +
      barra(1050, pag / N, "#3fae5a", "#e3d4bb", "#ffffff", "#5a3d16") + pieMora(m, 1170, "#5a3d16"), false);
  }

  /* 5 · Balcón con macetas: maceta en flor = pagó. */
  function cuotasMacetas(m, r) {
    const N = m.unidades, pag = Math.min(m.pagaron, N);
    const ok = new Set(barajar([...Array(N).keys()], r).slice(0, pag));
    const flores = ["#e8735a", "#f2a65a", "#e87ba4", "#9b6bc4", "#ffcb45", "#ffffff"];
    const fondo = '<defs><linearGradient id="tarde" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9a8"/><stop offset=".6" stop-color="#ffb38a"/><stop offset="1" stop-color="#f59a7a"/></linearGradient></defs>' +
      '<rect width="' + W + '" height="' + H + '" fill="url(#tarde)"/><circle cx="160" cy="330" r="90" fill="#fff1c9" opacity=".8"/>';
    const cols = 8, x0 = 90, paso = (W - 2 * x0) / cols;
    let p = "";
    [0, 1].forEach(fila => {
      const yb = 560 + fila * 280;
      p += '<rect x="50" y="' + yb + '" width="980" height="22" rx="8" fill="#6b4a2b"/>' +
        [...Array(13)].map((_, k) => '<rect x="' + (64 + k * 78) + '" y="' + (yb + 22) + '" width="12" height="150" fill="#6b4a2b"/>').join("") +
        '<rect x="50" y="' + (yb + 168) + '" width="980" height="16" rx="6" fill="#6b4a2b"/>';
    });
    for (let i = 0; i < N; i++) {
      const c = i % cols, fila = Math.floor(i / cols), cx = x0 + paso * c + paso / 2, yb = 560 + fila * 280, on = ok.has(i);
      p += '<path d="M' + (cx - 38) + " " + (yb - 70) + " L" + (cx + 38) + " " + (yb - 70) + " L" + (cx + 28) + " " + yb + " L" + (cx - 28) + " " + yb + ' Z" fill="#c8693f" stroke="#6b3a1e" stroke-width="4"/>' +
        '<rect x="' + (cx - 44) + '" y="' + (yb - 82) + '" width="88" height="16" rx="5" fill="#d97a4d" stroke="#6b3a1e" stroke-width="4"/>';
      if (on) {
        const col = flores[Math.floor(r() * flores.length)];
        p += '<path d="M' + cx + " " + (yb - 82) + " Q" + (cx - 6) + " " + (yb - 130) + " " + cx + " " + (yb - 168) + '" stroke="#3f7d3a" stroke-width="6" fill="none"/>' +
          '<ellipse cx="' + (cx - 18) + '" cy="' + (yb - 118) + '" rx="16" ry="8" fill="#5c9e5a" transform="rotate(-30 ' + (cx - 18) + " " + (yb - 118) + ')"/><ellipse cx="' + (cx + 18) + '" cy="' + (yb - 132) + '" rx="16" ry="8" fill="#5c9e5a" transform="rotate(30 ' + (cx + 18) + " " + (yb - 132) + ')"/>' +
          [0, 72, 144, 216, 288].map(g => '<ellipse cx="' + cx + '" cy="' + (yb - 186) + '" rx="11" ry="20" fill="' + col + '" stroke="#6b3a1e" stroke-width="2" transform="rotate(' + g + " " + cx + " " + (yb - 172) + ')"/>').join("") +
          '<circle cx="' + cx + '" cy="' + (yb - 172) + '" r="10" fill="#ffcb45" stroke="#6b3a1e" stroke-width="2"/>';
      } else p += '<path d="M' + cx + " " + (yb - 82) + " q-2 -18 -14 -24 M" + cx + " " + (yb - 82) + ' q4 -14 14 -16" stroke="#8a7a5a" stroke-width="5" fill="none" stroke-linecap="round"/>';
    }
    return marco(fondo, titulo("Mantenimiento", "de " + m.nombre, "#5a2a1a", 128) + p +
      '<text x="' + W / 2 + '" y="1090" text-anchor="middle" ' + F + ' font-size="58" fill="#5a2a1a">' + pag + " ya florecieron · faltan " + (N - pag) + "</text>" +
      pieMora(m, 1160, "#5a2a1a"), false);
  }

  /* ---------------- AVANCE DEL MES EN CURSO ---------------- */
  /* Animación en pantalla (SMIL); al exportar la imagen se dibuja quieta y llena. */
  function anim(attr, desde, hasta, retraso) {
    if (!ANIMAR) return "";
    return '<animate attributeName="' + attr + '" from="' + desde + '" to="' + hasta + '" begin="' + (retraso || 0) + 's" dur="1.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>';
  }
  function datosAvance(m) {
    const dias = new Date(+m.anio, parseInt(m.id.slice(5), 10), 0).getDate();
    const dia = m.id === hoyId ? HOY.getDate() : dias;
    const esperado = m.unidades * cuota;
    const a = aguaCobro.length ? aguaCobro[aguaCobro.length - 1] : null;
    return { dias: dias, dia: dia, pctDia: dia / dias, esperado: esperado, pctManto: esperado ? Math.min(1, m.manto / esperado) : 0,
      agua: a ? { nombre: a.nombre, cobrado: a.montoCargado - a.montoPendiente, total: a.montoCargado, pagados: a.pagados, cargados: a.cargados, pct: a.montoCargado ? (a.montoCargado - a.montoPendiente) / a.montoCargado : 0 } : null };
  }
  function ritmo(d) {
    const p = Math.round(d.pctManto * 100), t = Math.round(d.pctDia * 100);
    if (d.pctManto >= 0.999) return ["¡Mantenimiento completo!", "#2f7d32"];
    return p >= t ? ["Vamos al día: el mes va al " + t + "% y la cobranza al " + p + "%", "#2f7d32"] : ["El mes va al " + t + "% y la cobranza al " + p + "%", "#b3261e"];
  }

  /* 1 · Barras que se llenan, con el calendario del mes como referencia. */
  function avanceBarras(m, r) {
    const d = datosAvance(m), x = 150, w = 780;
    const fondo = '<rect width="' + W + '" height="' + H + '" fill="#f3f7f1"/>';
    let c = "";
    /* Calendario */
    c += '<text x="' + x + '" y="352" ' + F + ' font-size="34" fill="#24304a">Día ' + d.dia + " de " + d.dias + "</text>" +
      '<rect x="' + x + '" y="370" width="' + w + '" height="26" rx="13" fill="#dfe6dc"/>' +
      '<rect x="' + x + '" y="370" width="' + Math.round(w * d.pctDia) + '" height="26" rx="13" fill="#9aa8b6">' + anim("width", 0, Math.round(w * d.pctDia)) + "</rect>";
    for (let i = 1; i < d.dias; i++) if (i % 5 === 0) c += '<line x1="' + (x + w * i / d.dias) + '" y1="372" x2="' + (x + w * i / d.dias) + '" y2="394" stroke="#f3f7f1" stroke-width="3"/>';
    const tarjeta = (y, alto, titulo2, cifra, sub, pct, color, puntos, llenos) => {
      let t = '<rect x="' + (x - 30) + '" y="' + y + '" width="' + (w + 60) + '" height="' + alto + '" rx="28" fill="#ffffff" stroke="#d5ddd2" stroke-width="3"/>' +
        '<text x="' + x + '" y="' + (y + 62) + '" ' + F + ' font-size="40" fill="#24304a">' + esc(titulo2) + "</text>" +
        '<text x="' + (x + w) + '" y="' + (y + 62) + '" text-anchor="end" ' + F + ' font-size="40" fill="' + color + '">' + Math.round(pct * 100) + "%</text>" +
        '<rect x="' + x + '" y="' + (y + 86) + '" width="' + w + '" height="64" rx="32" fill="#eef1ec" stroke="#c9d3c5" stroke-width="3"/>' +
        '<rect x="' + x + '" y="' + (y + 86) + '" width="' + Math.max(0, Math.round(w * pct)) + '" height="64" rx="32" fill="' + color + '">' + anim("width", 0, Math.round(w * pct), 0.2) + "</rect>" +
        '<line x1="' + (x + w * d.pctDia) + '" y1="' + (y + 76) + '" x2="' + (x + w * d.pctDia) + '" y2="' + (y + 160) + '" stroke="#24304a" stroke-width="4" stroke-dasharray="8 6"/>' +
        '<text x="' + x + '" y="' + (y + 202) + '" ' + F + ' font-size="44" fill="#0b0b0b">' + esc(cifra) + "</text>" +
        '<text x="' + x + '" y="' + (y + 248) + '" ' + F + ' font-size="32" fill="#52514e">' + esc(sub) + "</text>";
      if (puntos) for (let i = 0; i < puntos; i++) {
        const cx = x + 12 + i * Math.min(36, (w - 24) / Math.max(1, puntos - 1)), lleno = i < llenos;
        t += '<circle cx="' + cx + '" cy="' + (y + 284) + '" r="12" fill="' + (lleno ? color : "#e1e6de") + '"' + (ANIMAR && lleno ? ' opacity="0"' : "") + ">" + (ANIMAR && lleno ? '<animate attributeName="opacity" from="0" to="1" begin="' + (0.3 + i * 0.08).toFixed(2) + 's" dur=".3s" fill="freeze"/>' : "") + "</circle>";
      }
      return t;
    };
    const conAgua = !!d.agua;
    c += tarjeta(430, 320, "Mantenimiento de " + m.nombre, $(m.manto) + " de " + $(d.esperado), m.pagaron + " de " + m.unidades + " departamentos", d.pctManto, "#3fae5a", m.unidades, m.pagaron);
    if (conAgua) c += tarjeta(775, 320, "Recibo del agua de " + d.agua.nombre, $(d.agua.cobrado) + " de " + $(d.agua.total), d.agua.pagados + " de " + d.agua.cargados + " recibos pagados", d.agua.pct, "#2f8fd8", d.agua.cargados, d.agua.pagados);
    const rt = ritmo(d);
    c += '<text x="' + W / 2 + '" y="' + (conAgua ? 1150 : 805) + '" text-anchor="middle" ' + F + ' font-size="34" fill="' + rt[1] + '">' + esc(rt[0]) + "</text>" +
      '<text x="' + W / 2 + '" y="' + (conAgua ? 1196 : 850) + '" text-anchor="middle" ' + F + ' font-size="28" fill="#52514e">La línea punteada marca cuánto del mes ha pasado</text>';
    return marco(fondo, titulo("Así va", m.nombre, "#1d3f63", 128) + c, false);
  }

  /* 2 · El edificio y el tinaco se llenan conforme se paga. */
  function avanceEdificio(m, r) {
    const d = datosAvance(m);
    const fondo = '<defs><linearGradient id="atardecer" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26385f"/><stop offset="1" stop-color="#3d5a8a"/></linearGradient></defs><rect width="' + W + '" height="' + H + '" fill="url(#atardecer)"/>' +
      [...Array(20)].map(() => '<circle cx="' + Math.round(r() * W) + '" cy="' + Math.round(40 + r() * 260) + '" r="' + (1.5 + r() * 2.5).toFixed(1) + '" fill="#f3ead8" opacity=".7"/>').join("");
    const bx = 120, by = 350, bw = 440, bh = 640;
    const hm = Math.round(bh * d.pctManto);
    let c = '<defs><clipPath id="silueta"><rect x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + bh + '" rx="10"/></clipPath></defs>' +
      '<rect x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + bh + '" rx="10" fill="#33456e" stroke="#f3ead8" stroke-width="6"/>' +
      '<g clip-path="url(#silueta)"><rect x="' + bx + '" y="' + (by + bh - hm) + '" width="' + bw + '" height="' + hm + '" fill="#ffcb45">' + anim("height", 0, hm) + anim("y", by + bh, by + bh - hm) + "</rect></g>";
    for (let f = 0; f < 4; f++) for (let k = 0; k < 3; k++) c += '<rect x="' + (bx + 50 + k * 125) + '" y="' + (by + 50 + f * 150) + '" width="90" height="100" rx="6" fill="none" stroke="#1d2b4c" stroke-width="5"/>';
    c += '<rect x="' + (bx - 20) + '" y="' + (by - 24) + '" width="' + (bw + 40) + '" height="28" rx="6" fill="#f3ead8"/>' +
      '<text x="' + (bx + bw / 2) + '" y="' + (by + bh + 70) + '" text-anchor="middle" ' + F + ' font-size="44" fill="#f3ead8">Mantenimiento ' + Math.round(d.pctManto * 100) + "%</text>" +
      '<text x="' + (bx + bw / 2) + '" y="' + (by + bh + 118) + '" text-anchor="middle" ' + F + ' font-size="32" fill="#c9d6ee">' + m.pagaron + " de " + m.unidades + " · " + $(m.manto) + "</text>";
    if (d.agua) {
      const tx = 660, ty = 560, tw = 300, th = 430, ha = Math.round(th * d.agua.pct);
      c += '<defs><clipPath id="tinacoA"><rect x="' + tx + '" y="' + ty + '" width="' + tw + '" height="' + th + '" rx="50"/></clipPath></defs>' +
        '<rect x="' + tx + '" y="' + ty + '" width="' + tw + '" height="' + th + '" rx="50" fill="#33456e" stroke="#f3ead8" stroke-width="6"/>' +
        '<g clip-path="url(#tinacoA)"><rect x="' + tx + '" y="' + (ty + th - ha) + '" width="' + tw + '" height="' + ha + '" fill="#5ec2ff">' + anim("height", 0, ha, 0.3) + anim("y", ty + th, ty + th - ha, 0.3) + "</rect></g>" +
        '<rect x="' + (tx + 90) + '" y="' + (ty - 36) + '" width="120" height="40" rx="10" fill="#f3ead8"/>' +
        '<text x="' + (tx + tw / 2) + '" y="' + (by + bh + 70) + '" text-anchor="middle" ' + F + ' font-size="44" fill="#f3ead8">Agua ' + Math.round(d.agua.pct * 100) + "%</text>" +
        '<text x="' + (tx + tw / 2) + '" y="' + (by + bh + 118) + '" text-anchor="middle" ' + F + ' font-size="32" fill="#c9d6ee">recibo de ' + esc(d.agua.nombre) + ": " + d.agua.pagados + " de " + d.agua.cargados + "</text>";
    }
    const rt = ritmo(d);
    c += '<text x="' + W / 2 + '" y="1180" text-anchor="middle" ' + F + ' font-size="32" fill="' + (rt[1] === "#2f7d32" ? "#9be7a1" : "#ffb4a8") + '">' + esc(rt[0]) + "</text>";
    return marco(fondo, titulo("Así va", m.nombre, "#f3ead8", 128) + c, true);
  }

  /* ---------------- AGUA POR PAGAR ---------------- */
  function aguaDeudaTextos(a) {
    return { linea: a.pagados + " ya pagaron · " + a.pendientes + (a.pendientes === 1 ? " pendiente" : " pendientes"),
      monto: a.pendientes ? "Por cobrar: " + $(a.montoPendiente) : "¡Todos pagaron su agua!" };
  }
  /* 1 · Garrafones: lleno = ya pagó su agua. */
  function deudaGarrafones(a, r) {
    const N = a.cargados, ok = new Set(barajar([...Array(N).keys()], r).slice(0, a.pagados)), t = aguaDeudaTextos(a);
    const fondo = '<rect width="' + W + '" height="' + H + '" fill="#e3f2fb"/><path d="M0 980 H1080 V1350 H0 Z" fill="#cde6f5"/>';
    const cols = 4, filas = Math.ceil(N / cols), gw = 170, gh = Math.min(170, 600 / filas - 20), x0 = (W - cols * gw - (cols - 1) * 30) / 2;
    let g = "";
    for (let i = 0; i < N; i++) {
      const c = i % cols, f = Math.floor(i / cols), x = x0 + c * (gw + 30), y = 330 + f * (gh + 22), on = ok.has(i);
      const cuerpo = "M" + (x + 20) + " " + (y + 40) + " Q" + (x + 20) + " " + (y + 26) + " " + (x + 48) + " " + (y + 22) + " L" + (x + gw - 48) + " " + (y + 22) + " Q" + (x + gw - 20) + " " + (y + 26) + " " + (x + gw - 20) + " " + (y + 40) + " L" + (x + gw - 20) + " " + (y + gh - 12) + " Q" + (x + gw - 20) + " " + (y + gh) + " " + (x + gw - 34) + " " + (y + gh) + " L" + (x + 34) + " " + (y + gh) + " Q" + (x + 20) + " " + (y + gh) + " " + (x + 20) + " " + (y + gh - 12) + " Z";
      g += '<rect x="' + (x + gw / 2 - 20) + '" y="' + y + '" width="40" height="26" rx="5" fill="' + (on ? "#1d6fb5" : "#9fb4c4") + '" stroke="#24304a" stroke-width="4"/>' +
        '<path d="' + cuerpo + '" fill="' + (on ? "#4aa8e8" : "#ffffff") + '" fill-opacity="' + (on ? 1 : 0.7) + '" stroke="#24304a" stroke-width="5"' + (on ? "" : ' stroke-dasharray="12 8"') + "/>" +
        (on ? '<rect x="' + (x + 34) + '" y="' + (y + 50) + '" width="14" height="' + (gh - 80) + '" rx="7" fill="#ffffff" opacity=".45"/>' : '<text x="' + (x + gw / 2) + '" y="' + (y + gh / 2 + 30) + '" text-anchor="middle" ' + F + ' font-size="56" fill="#9fb4c4">?</text>');
    }
    return marco(fondo, titulo("El agua de " + a.nombre, "¿ya la pagaste?", "#1d3f63", 128) + g +
      '<text x="' + W / 2 + '" y="1030" text-anchor="middle" ' + F + ' font-size="56" fill="#1d3f63">' + esc(t.linea) + "</text>" +
      '<text x="' + W / 2 + '" y="1095" text-anchor="middle" ' + F + ' font-size="46" fill="' + (a.pendientes ? "#b3261e" : "#2f7d32") + '">' + esc(t.monto) + "</text>" +
      '<text x="' + W / 2 + '" y="1160" text-anchor="middle" ' + F + ' font-size="34" fill="#24304a">Tu recibo y cómo pagarlo: página «Agua» del sitio</text>', false);
  }
  /* 2 · Tubería con llaves: la que corre = ya pagó. */
  function deudaLlaves(a, r) {
    const N = a.cargados, ok = new Set(barajar([...Array(N).keys()], r).slice(0, a.pagados)), t = aguaDeudaTextos(a);
    const fondo = '<rect width="' + W + '" height="' + H + '" fill="#123b4f"/>' + [...Array(18)].map(() => '<circle cx="' + Math.round(r() * W) + '" cy="' + Math.round(300 + r() * 700) + '" r="' + Math.round(3 + r() * 6) + '" fill="#2a6a86" opacity=".7"/>').join("");
    const porFila = Math.ceil(N / 2), paso = 900 / porFila;
    let g = "";
    [0, 1].forEach(fila => {
      const y = 380 + fila * 330;
      g += '<rect x="60" y="' + (y - 20) + '" width="960" height="40" rx="20" fill="#b8c4cc" stroke="#0b2533" stroke-width="5"/>';
    });
    for (let i = 0; i < N; i++) {
      const fila = Math.floor(i / porFila), c = i % porFila, x = 90 + c * paso + paso / 2, y = 380 + fila * 330, on = ok.has(i);
      g += '<rect x="' + (x - 12) + '" y="' + (y + 18) + '" width="24" height="44" fill="#b8c4cc" stroke="#0b2533" stroke-width="4"/>' +
        '<path d="M' + (x - 12) + " " + (y + 58) + " h46 q14 0 14 14 v14 h-26 v-6 h-34 Z\" fill=\"#b8c4cc\" stroke=\"#0b2533\" stroke-width=\"4\" stroke-linejoin=\"round\"/>" +
        '<rect x="' + (x - 26) + '" y="' + (y + 22) + '" width="52" height="12" rx="6" fill="' + (on ? "#3fae5a" : "#e05a4a") + '" stroke="#0b2533" stroke-width="3"/>';
      if (on) g += '<path d="M' + (x + 30) + " " + (y + 88) + " q-8 40 0 100 q8 -60 0 -100 Z\" fill=\"#5ec2ff\"/>" +
        '<path d="M' + (x + 4) + " " + (y + 196) + " h52 l-6 70 h-40 Z\" fill=\"#5ec2ff\" stroke=\"#e6f3fb\" stroke-width=\"4\"/>";
      else g += '<path d="M' + (x + 4) + " " + (y + 196) + " h52 l-6 70 h-40 Z\" fill=\"none\" stroke=\"#e6f3fb\" stroke-width=\"4\" stroke-dasharray=\"8 6\"/>" +
        '<path d="M' + (x + 20) + " " + (y + 30) + " l18 40\" stroke=\"#e05a4a\" stroke-width=\"3\"/><rect x=\"" + (x + 26) + '" y="' + (y + 68) + '" width="34" height="44" rx="6" fill="#e05a4a" transform="rotate(-10 ' + (x + 43) + " " + (y + 90) + ')"/><text x="' + (x + 43) + '" y="' + (y + 101) + '" text-anchor="middle" ' + F + ' font-size="30" fill="#ffffff">!</text>';
    }
    return marco(fondo, titulo("El agua de " + a.nombre, "¿ya la pagaste?", "#e6f3fb", 128) + g +
      '<text x="' + W / 2 + '" y="1050" text-anchor="middle" ' + F + ' font-size="56" fill="#ffffff">' + esc(t.linea) + "</text>" +
      '<text x="' + W / 2 + '" y="1112" text-anchor="middle" ' + F + ' font-size="46" fill="' + (a.pendientes ? "#ffb4a8" : "#9be7a1") + '">' + esc(t.monto) + "</text>" +
      '<text x="' + W / 2 + '" y="1170" text-anchor="middle" ' + F + ' font-size="34" fill="#cfe6f4">Tu recibo y cómo pagarlo: página «Agua» del sitio</text>', true);
  }

  const ESTILOS = { cuotas: [cuotasEdificio, cuotasCasitas, cuotasMonedas, cuotasBuzones, cuotasMacetas], agua: [aguaTinaco, aguaGotas, aguaVaso], aguadeuda: [deudaGarrafones, deudaLlaves], avance: [avanceBarras, avanceEdificio] };
  const NOMBRES_ESTILO = { cuotas: ["Edificio", "Casitas", "Alcancía", "Buzones", "Macetas"], agua: ["Tinaco", "Gotas", "Vaso"], aguadeuda: ["Garrafones", "Llaves"], avance: ["Barras", "Edificio"] };

  /* ---------------- Pantalla ---------------- */
  let svgActual = "", svgEstatico = "";
  function estiloDe(m) {
    const n = ESTILOS[estado.tipo].length;
    if (estado.estilo >= 1 && estado.estilo <= n) return estado.estilo;
    return ((parseInt(m.id.slice(5), 10) + parseInt(m.id.slice(0, 4), 10) * 12 + (estado.tipo === "agua" ? 1 : 0)) % n) + 1;   // rota cada mes
  }
  function pintar() {
    const lista = estado.tipo === "aguadeuda" ? aguaCobro : meses;
    let m = lista.find(x => x.id === estado.mes);
    if (!m && estado.tipo === "avance") {
      m = meses.find(x => x.id === hoyId) || { id: hoyId, nombre: MESES[parseInt(hoyId.slice(5), 10) - 1], anio: hoyId.slice(0, 4), vivo: true, pagaron: 0, manto: 0, unidades: MISIONES.unidades };
    }
    if (!m) { const cerrados = lista.filter(x => x.id < hoyId); m = cerrados[cerrados.length - 1] || lista[lista.length - 1]; }   // por omisión, el último mes ya cerrado
    const sel = document.getElementById("selMes");
    if (!m) {
      document.getElementById("lienzo").innerHTML = '<p style="padding:2rem 1rem;text-align:center;color:var(--muted)">Todavía no hay recibos de agua con cargo en la hoja.</p>';
      svgActual = ""; sel.innerHTML = ""; marcarBotones(0); return;
    }
    estado.mes = m.id;
    const e = estiloDe(m);
    const hoyTxt = HOY.getDate() + " de " + MESES[HOY.getMonth()];
    PERIODO = estado.tipo === "aguadeuda" ? "Recibo del agua de " + m.nombre + " · al " + hoyTxt
      : m.id === hoyId ? "Avance al " + hoyTxt + " " + HOY.getFullYear() + " · mes en curso"
      : "Cierre de " + m.nombre + " " + m.anio;
    const generar = animar => { ANIMAR = animar; const out = ESTILOS[estado.tipo][e - 1](m, azar(m.id + estado.tipo + e)); ANIMAR = true; return out; };
    svgActual = generar(true);
    svgEstatico = generar(false);
    document.getElementById("lienzo").innerHTML = svgActual;
    document.getElementById("sub").textContent = PERIODO + (m.vivo ? " · en vivo desde la hoja" : " · tablas contables");
    marcarBotones(e);
    sel.innerHTML = "";
    const opciones = estado.tipo === "avance" && !meses.some(x => x.id === hoyId) ? [m].concat(meses.slice().reverse()) : lista.slice().reverse();
    opciones.forEach(x => sel.add(new Option(x.nombre + " " + x.anio + (x.id === hoyId ? " (en curso)" : ""), x.id)));
    sel.value = m.id;
    const p = new URLSearchParams({ tipo: estado.tipo, mes: m.id });
    if (estado.estilo) p.set("estilo", estado.estilo);
    history.replaceState(null, "", "?" + p.toString());
  }

  function marcarBotones(e) {
    document.querySelectorAll("[data-tipo]").forEach(b => b.classList.toggle("on", b.dataset.tipo === estado.tipo));
    const g = document.getElementById("gEstilo");
    g.innerHTML = "<span>Estilo</span>" + NOMBRES_ESTILO[estado.tipo].map((n, i) => '<button data-estilo="' + (i + 1) + '"' + (i + 1 === e ? ' class="on"' : "") + ">" + n + "</button>").join("");
  }
  function png() {
    return new Promise((ok, mal) => {
      const img = new Image();
      const url = URL.createObjectURL(new Blob([svgEstatico], { type: "image/svg+xml" }));
      img.onload = () => {
        const c = document.createElement("canvas"); c.width = W; c.height = H;
        c.getContext("2d").drawImage(img, 0, 0, W, H);
        URL.revokeObjectURL(url);
        c.toBlob(b => (b ? ok(b) : mal(new Error("sin imagen"))), "image/png");
      };
      img.onerror = () => mal(new Error("no se pudo dibujar"));
      img.src = url;
    });
  }
  const nombreArchivo = () => "misiones-" + estado.tipo + "-" + estado.mes + ".png";
  function avisar(t) { document.getElementById("estado").textContent = t; }

  document.getElementById("descargar").addEventListener("click", async () => {
    try {
      const b = await png();
      const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = nombreArchivo(); a.click();
      avisar("Imagen descargada. Compártela al grupo desde tu galería.");
    } catch (e) { avisar("No se pudo crear la imagen: " + e.message); }
  });
  document.getElementById("compartir").addEventListener("click", async () => {
    try {
      const archivo = new File([await png()], nombreArchivo(), { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
        await navigator.share({ files: [archivo] });
        avisar("Listo.");
      } else {
        const a = document.createElement("a"); a.href = URL.createObjectURL(archivo); a.download = archivo.name; a.click();
        avisar("Este navegador no comparte imágenes directo: se descargó; adjúntala en WhatsApp.");
      }
    } catch (e) { if (e.name !== "AbortError") avisar("No se pudo compartir: " + e.message); }
  });
  document.getElementById("gTipo").addEventListener("click", e => { const b = e.target.closest("[data-tipo]"); if (b) { estado.tipo = b.dataset.tipo; estado.estilo = 0; estado.mes = ""; pintar(); } });
  document.getElementById("gEstilo").addEventListener("click", e => { const b = e.target.closest("[data-estilo]"); if (b) { estado.estilo = +b.dataset.estilo; pintar(); } });
  document.getElementById("selMes").addEventListener("change", e => { estado.mes = e.target.value; pintar(); });

  Promise.all([cargar(), incrustar()]).then(pintar);
})();
</script>
</body>
</html>
