<style>
  .md { max-width: 620px; margin: 0 auto; padding: 1.25rem 1rem 4rem; }

  .md .lead { color: var(--ink-2); margin: 0 0 1rem; }
  .deptos { display: grid; grid-template-columns: repeat(8, 1fr); gap: .4rem; }
  @media (max-width: 520px) { .deptos { grid-template-columns: repeat(4, 1fr); } }
  .deptos button { font: inherit; font-weight: 700; font-size: 1.1rem; min-height: 50px; border: 2px solid var(--baseline); border-radius: 12px; background: var(--surface); color: var(--ink); cursor: pointer; }
  .deptos button.sel { background: var(--accent); border-color: var(--accent); color: #fff; }
  .total { margin: 1.2rem 0 .6rem; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 1.2rem 1.3rem; box-shadow: var(--shadow); }
  .total .k { font-size: .78rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
  .total .big { font-size: 2.6rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; margin: .2rem 0; }
  .total .big.mal { color: var(--bad-text); } .total .big.bien { color: var(--good-text); }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin: .4rem 0 .2rem; }
  .chip { font-size: .85rem; font-weight: 700; padding: .25rem .7rem; border-radius: 999px; background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
  .chip.verde { background: color-mix(in srgb, var(--good-text) 15%, var(--surface)); }
  .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin: .8rem 0 1rem; }
  .acciones a { text-align: center; text-decoration: none; font-weight: 800; padding: .85rem; border-radius: 14px; border: 1px solid var(--border); color: var(--ink); background: var(--surface); }
  .acciones a.prim { background: var(--accent); border-color: var(--accent); color: #fff; }
  details.bloque { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; margin: .6rem 0; padding: 0 1rem; }
  details.bloque summary { cursor: pointer; list-style: none; padding: .95rem 0; font-weight: 700; display: flex; justify-content: space-between; gap: .5rem; }
  details.bloque summary::after { content: "▾"; color: var(--muted); } details.bloque[open] summary::after { content: "▴"; }
  details.bloque summary b { font-variant-numeric: tabular-nums; }
  .fila { display: flex; justify-content: space-between; align-items: center; gap: .6rem; padding: .55rem 0; border-top: 1px dashed var(--grid); font-size: .95rem; }
  .fila small { display: block; color: var(--muted); font-size: .8rem; }
  .est { font-size: .78rem; font-weight: 800; padding: .15rem .55rem; border-radius: 999px; white-space: nowrap; }
  .est.ok { background: #d4edda; color: #1d5a2a; } .est.no { background: #f8d7da; color: #7a1c24; } .est.ade { background: #dbe8f7; color: #1d3f63; } .est.pen { background: #fff3cd; color: #7a5a00; }
  .nota { font-size: .88rem; color: var(--ink-2); margin: .6rem 0 1rem; }
  .chip { font: inherit; border: 0; cursor: pointer; } .chip.pen { background: #fff3cd; color: #7a5a00; }
  .pzs { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: .45rem; margin: .7rem 0 .2rem; }
  .pz { display: flex; flex-direction: column; align-items: center; gap: .1rem; font: inherit; color: var(--ink); background: color-mix(in srgb, var(--bad-text) 9%, var(--page)); border: 1px solid color-mix(in srgb, var(--bad-text) 25%, var(--border)); border-radius: 14px; padding: .6rem .3rem; cursor: pointer; }
  .pz.ok { background: color-mix(in srgb, var(--good-text) 10%, var(--page)); border-color: color-mix(in srgb, var(--good-text) 30%, var(--border)); }
  .pz span { font-size: 1.4rem; } .pz b { font-size: 1.1rem; font-variant-numeric: tabular-nums; } .pz small { font-size: .78rem; color: var(--ink-2); }
  .rev { display: block; width: 100%; margin-top: .5rem; font: inherit; font-weight: 700; text-align: left; padding: .6rem .8rem; border-radius: 12px; border: 0; background: #fff3cd; color: #7a5a00; cursor: pointer; }
  .rev.ade { background: #dbe8f7; color: #1d3f63; }
  .acciones button { font: inherit; font-weight: 800; padding: .85rem; border-radius: 14px; border: 1px solid var(--border); color: var(--ink); background: var(--surface); cursor: pointer; }
  .pasos { display: grid; grid-template-columns: repeat(3, 1fr); gap: .3rem; margin-top: .9rem; font-size: .8rem; font-weight: 700; text-align: center; }
  .pasos span { padding: .45rem .2rem; border-radius: 10px; background: var(--page); border: 1px solid var(--border); color: var(--muted); }
  .pasos .ok { background: #d4edda; color: #1d5a2a; border-color: transparent; } .pasos .pen { background: #fff3cd; color: #7a5a00; border-color: transparent; } .pasos .no { background: #f8d7da; color: #7a1c24; border-color: transparent; }
  .fila-b { grid-template-columns: 1fr auto auto !important; }
  .como { display: block; width: 100%; margin-top: .8rem; font: inherit; font-weight: 700; padding: .75rem; border-radius: 12px; border: 1px dashed var(--baseline); background: var(--page); color: var(--ink); cursor: pointer; }
  h2.sec { font-size: 1.05rem; margin: 1.3rem 0 .5rem; } h2.sec small { display: block; font-weight: 400; color: var(--muted); font-size: .82rem; }
  .lista { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  .fila-b { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: .6rem; width: 100%; text-align: left; font: inherit; color: var(--ink); background: none; border: 0; border-top: 1px solid var(--grid); padding: .8rem 1rem; cursor: pointer; min-height: 62px; }
  .fila-b:first-child { border-top: 0; } .fila-b:active, .fila-b:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .fila-b small { display: block; color: var(--muted); font-size: .82rem; } .fila-b i { font-style: normal; color: var(--muted); font-size: 1.3rem; }
  .desac { margin-top: 1.6rem; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 1rem 1.1rem; }
  .desac h2 { font-size: 1.1rem; margin: 0 0 .5rem; } .desac ol { margin: 0 0 .8rem 1.1rem; padding: 0; color: var(--ink-2); } .desac li { margin: .45rem 0; }
  .wa { display: block; text-align: center; text-decoration: none; font-weight: 800; padding: .85rem; border-radius: 14px; background: #25d366; color: #fff; margin: 1.2rem 0 .5rem; }
  .desac .wa { display: block; text-align: center; text-decoration: none; font-weight: 800; padding: .85rem; border-radius: 14px; background: #25d366; color: #fff; }
  @media (prefers-color-scheme: dark) { .deptos button.sel, .acciones a.prim { color: #0d0d0d; } .est.ok { background: #1d4a2a; color: #b8f0c6; } .est.no { background: #5a1d22; color: #ffb3b9; } .est.ade { background: #1d3354; color: #bcd6f5; } .est.pen { background: #5a4300; color: #ffe08a; } }
</style>

<main class="md">

  <p class="lead">Toca tu departamento.</p>
  <div class="deptos" id="deptos"></div>
  <div id="res"></div>
</main>
<script>
(function () {
  "use strict";
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0qO7rHUmBqUJOuwjBkYIu4O8_FrWlC8f_DyLj3DrhN1h5ApHpdfKVmUgx_aVH3aJ-/exec";
  const $ = id => document.getElementById(id);
  const $0 = v => "$" + Math.round(Math.abs(v)).toLocaleString("es-MX");
  const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let depto = null;
  try { const g = +localStorage.getItem("misiones_depto"); if (g >= 1 && g <= 16) depto = g; } catch (e) {}
  for (let i = 1; i <= 16; i++) { const b = document.createElement("button"); b.type = "button"; b.textContent = i; b.dataset.n = i; b.setAttribute("aria-label", "Departamento " + i); b.onclick = () => elegir(i); $("deptos").appendChild(b); }
  function elegir(n) {
    depto = n; try { localStorage.setItem("misiones_depto", n); } catch (e) {}
    [...$("deptos").children].forEach(x => { x.classList.toggle("sel", +x.dataset.n === n); x.setAttribute("aria-pressed", +x.dataset.n === n); });
    history.replaceState(null, "", "?depto=" + n);
    cargar(n);
  }
  async function cargar(n) {
    $("res").innerHTML = '<p class="nota" style="padding:1rem 0">Consultando la hoja de la mesa…</p>';
    try {
      const r = await fetch(SCRIPT_URL + "?accion=midepto&depto=" + n + "&t=" + Date.now(), { cache: "no-store" });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || "sin datos");
      if (n === depto) $("res").innerHTML = pintar(j);
    } catch (e) { $("res").innerHTML = '<p class="nota">La hoja de la mesa no respondió en este momento. Intenta en unos minutos; si sigue igual, avísale a la mesa directiva.</p>'; console.warn("[Mi depto] " + e.message); }
  }
  let J = null;
  const MESN = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  const mesDe = id => { const n = MESN[parseInt(id.slice(5), 10) - 1]; return n.charAt(0).toUpperCase() + n.slice(1) + " " + id.slice(0, 4); };
  const pagosDe = id => (J.pagos || []).filter(p => p.mes === id);
  const enRev = p => !/confirm|rechaz/i.test(p.estatus);
  const estTxt = e => /confirm/i.test(e) ? "confirmado" : /rechaz/i.test(e) ? "no encontrado" : "en revisión";
  const estCls = e => /confirm/i.test(e) ? "ok" : /rechaz/i.test(e) ? "no" : "pen";
  const wa = t => "https://wa.me/?text=" + encodeURIComponent(t);
  const L = (k, v, cls) => '<div class="cuenta-l' + (cls ? " " + cls : "") + '"><span>' + k + "</span><b>" + v + "</b></div>";
  /* Normaliza lo que manda el script (también con una versión anterior): agua y totales solo desde octubre. */
  function normal(j) {
    const desde = j.desde || "2026-10";
    j.agua = (j.agua || []).filter(a => a.mes >= desde);
    j.aguaPendiente = j.agua.filter(a => !a.pagado).reduce((x, a) => x + a.cargo, 0);
    const ex = j.extraordinaria && j.extraordinaria.monto > 0 ? j.extraordinaria : null;
    j.total = j.debeManto + j.aguaPendiente + (ex ? ex.pendiente : 0);
    return j;
  }
  function pintar(j) {
    J = normal(j);
    const rev = (j.pagos || []).filter(enRev).reduce((a, p) => a + (p.mantenimiento || 0) + (p.agua || 0) + (p.extraordinario || 0), 0);
    const pas = j.meses.filter(m => !m.futuro), fut = j.meses.filter(m => m.futuro), ex = j.extraordinaria && j.extraordinaria.monto > 0 ? j.extraordinaria : null;
    const debe = j.total > 0.5;
    const pieza = (ico, k, v, ok, info) => '<button class="pz ' + (ok ? "ok" : "") + '" data-info="' + info + '"><span>' + ico + "</span><b>" + (ok ? "✓" : $0(v)) + "</b><small>" + k + "</small></button>";
    let h = '<section class="total"><div class="k">Depto ' + j.depto + " · debes hoy</div>" +
      '<div class="big ' + (debe ? "mal" : "bien") + '">' + (debe ? $0(j.total) : "✓ Al corriente") + "</div>" +
      '<div class="pzs">' + pieza("🧾", "Mantenimiento", j.debeManto, j.debeManto <= 0.5, "manto") + pieza("💧", "Agua", j.aguaPendiente, j.aguaPendiente <= 0.5, "agua") + (ex ? pieza("⭐", "Extraordinaria", ex.pendiente, ex.pendiente <= 0.5, "extra") : "") + "</div>" +
      (rev > 0.5 ? '<button class="rev" data-info="revision">⏳ En revisión ' + $0(rev) + (debe ? " · si se confirma: " + $0(Math.max(0, j.total - rev)) : "") + "</button>" : "") +
      (j.adelantado > 0.5 ? '<button class="rev ade" data-info="adelantado">⏩ Adelantado ' + $0(j.adelantado) + "</button>" : "") +
      '<div class="acciones"><a class="prim" href="pago.html?depto=' + j.depto + '">💳 Pagar</a><button id="btnComo">🧮 Ver la cuenta</button></div></section>';
    h += '<h2 class="sec">🧾 Mantenimiento</h2><div class="lista">' +
      fut.map(m => '<button class="fila-b" data-mes="' + m.id + '"><b>' + esc(m.nombre) + '</b><span class="est ade">adelantado</span><i>›</i></button>').join("") +
      pas.slice().reverse().map(m => { const pr = pagosDe(m.id).some(enRev); const st = m.diferencia < -0.5 ? (pr ? ["pen", "⏳ en revisión"] : m.enCurso ? ["pen", "por pagar"] : ["no", "falta " + $0(-m.diferencia)]) : ["ok", "✓ pagado"];
        return '<button class="fila-b" data-mes="' + m.id + '"><b>' + esc(m.nombre) + '</b><span class="est ' + st[0] + '">' + st[1] + "</span><i>›</i></button>"; }).join("") + "</div>";
    if (j.agua.length) h += '<h2 class="sec">💧 Agua</h2><div class="lista">' + j.agua.slice().reverse().map((a, i) => '<button class="fila-b" data-agua="' + (j.agua.length - 1 - i) + '"><b>' + esc(a.nombre) + '</b><span class="est ' + (a.pagado ? "ok" : "no") + '">' + (a.pagado ? "✓ pagado" : $0(a.cargo)) + "</span><i>›</i></button>").join("") + "</div>";
    if (ex) h += '<h2 class="sec">⭐ Extraordinaria</h2><div class="lista"><button class="fila-b" data-info="extra"><b>' + esc(ex.nombre) + '</b><span class="est ' + (ex.pendiente <= 0.5 ? "ok" : "no") + '">' + (ex.pendiente <= 0.5 ? "✓ pagada" : "falta " + $0(ex.pendiente)) + "</span><i>›</i></button></div>";
    if (j.pagos.length) h += '<h2 class="sec">📨 Tus pagos reportados</h2><div class="lista">' + j.pagos.map((p, i) => '<button class="fila-b" data-pago="' + i + '"><b>' + (p.mes ? esc(mesDe(p.mes)) : esc(p.fecha)) + " · " + $0(p.total) + '</b><span class="est ' + estCls(p.estatus) + '">' + estTxt(p.estatus) + "</span><i>›</i></button>").join("") + "</div>";
    h += '<div class="lista" style="margin-top:1rem"><button class="fila-b" data-info="previo"><b>Antes de octubre 2026</b><span class="est ok">no se cobra</span><i>›</i></button></div>';
    h += '<a class="wa" href="' + wa("Hola, mesa directiva. Soy del depto " + j.depto + " y no me cuadra: ") + '" target="_blank" rel="noopener">🤔 ¿No te cuadra? Escribe a la mesa</a>';
    return h;
  }
  const pasos = st => '<div class="pasos"><span class="' + (/confirm/i.test(st) ? "ok" : "ok") + '">✓ Reportado</span><span class="' + (/confirm/i.test(st) ? "ok" : /rechaz/i.test(st) ? "no" : "pen") + '">' + (/rechaz/i.test(st) ? "✕ No encontrado" : "⏳ Revisión") + '</span><span class="' + (/confirm/i.test(st) ? "ok" : "") + '">' + (/confirm/i.test(st) ? "✓" : "○") + " Confirmado</span></div>";
  function detalleMes(id) {
    const m = J.meses.find(x => x.id === id), ps = pagosDe(id), pend = ps.filter(enRev), rech = ps.filter(p => /rechaz/i.test(p.estatus));
    let h = m.futuro ? L("Pagaste por adelantado", $0(m.manto), "tot") : L("Cuota", $0(m.cuota)) + L("Registrado", $0(m.manto)) + L(m.diferencia < -0.5 ? "Falta" : "Diferencia", $0(Math.abs(m.diferencia)), "tot");
    h += ps.map(p => L("Reportaste el " + esc(p.fecha), $0(p.total) + ' <span class="est ' + estCls(p.estatus) + '">' + estTxt(p.estatus) + "</span>")).join("");
    const listo = m.futuro || m.diferencia >= -0.5;
    if (!listo && !pend.length) h += '<div class="acc"><a class="p" href="pago.html?depto=' + J.depto + "&mes=" + id + '">' + (rech.length ? "Reportar de nuevo" : "Ya pagué: reportarlo") + '</a><a href="' + wa("Hola, mesa directiva. Depto " + J.depto + ": " + mesDe(id) + " aparece sin pagar, pero pagué el [fecha] por $[monto].") + '" target="_blank" rel="noopener">💬 Escribir a la mesa</a></div>';
    else if (pend.length) h += pasos(pend[0].estatus);
    ventana((listo ? "✓ " : pend.length ? "⏳ " : "✕ ") + mesDe(id), h);
  }
  function detalleAgua(i) {
    const a = J.agua[i];
    ventana((a.pagado ? "✓ " : "") + "Agua de " + a.nombre, L("Consumo", a.consumo + " m³") + L(a.pagado ? "Pagado" : "A pagar", $0(a.cargo), "tot") +
      '<div class="acc">' + (a.pagado ? "" : '<a class="p" href="pago.html?depto=' + J.depto + "&agua=" + a.cargo + "&mes=" + a.mes + '">💳 Pagar el agua</a>') + '<a href="agua.html">Ver mis lecturas</a></div>');
  }
  function detallePago(i) {
    const p = J.pagos[i];
    const h = [["Mantenimiento", p.mantenimiento], ["Agua", p.agua], ["Extraordinaria", p.extraordinario], ["Casa club", p.casaclub]].filter(x => x[1]).map(x => L(x[0], $0(x[1]))).join("") + L("Total", $0(p.total), "tot") + pasos(p.estatus);
    ventana((p.mes && J.desde && p.mes < J.desde ? "🙏 Aportación · " : "") + (p.mes ? mesDe(p.mes) : p.fecha), h + (/rechaz/i.test(p.estatus) ? '<div class="acc"><a href="' + wa("Hola, mesa directiva. Depto " + J.depto + ": mi pago del " + p.fecha + " por " + $0(p.total) + " aparece como no encontrado. Adjunto comprobante.") + '" target="_blank" rel="noopener">💬 Enviar mi comprobante a la mesa</a></div>' : ""));
  }
  const INFO = {
    manto: () => ["🧾 Mantenimiento", L("Pendiente", $0(J.debeManto), "tot") + '<p class="exp">Cuotas de ' + $0(J.cuota) + " desde octubre 2026, menos lo registrado.</p>"],
    agua: () => ["💧 Agua", L("Pendiente", $0(J.aguaPendiente), "tot") + '<p class="exp">Recibos de agua sin pagar, desde octubre 2026.</p>'],
    extra: () => { const ex = J.extraordinaria; return [(ex.detalle && ex.detalle.length > 1 ? "⭐ Cuotas extraordinarias" : "⭐ " + ex.nombre), (ex.detalle && ex.detalle.length > 1 ? ex.detalle.map(x => L((x.pendiente > 0.5 ? "" : "✓ ") + x.nombre + (x.pendiente > 0.5 && x.pagado > 0.5 ? " (abonado " + $0(x.pagado) + ")" : ""), x.pendiente > 0.5 ? $0(x.pendiente) : "pagada")).join("") : L("Cuota", $0(ex.monto)) + L("Pagado", $0(ex.pagado))) + L(ex.pendiente > 0.5 ? "Falta" : "✓ Pagada", $0(ex.pendiente), "tot") + (ex.pendiente > 0.5 ? '<div class="acc"><a class="p" href="pago.html?depto=' + J.depto + '&extra=' + ex.pendiente + '">💳 Pagar la extraordinaria</a></div>' : "")]; },
    revision: () => ["⏳ En revisión", '<p class="exp">Pagos que reportaste y la mesa está confirmando con el banco. Aún no se restan.</p>' + pasos("Pendiente")],
    adelantado: () => ["⏩ Adelantado", '<p class="exp">Meses que pagaste antes de tiempo. Se aplican cuando lleguen.</p>'],
    previo: () => ["Antes de octubre 2026", '<p class="exp"><b>No se cobra.</b> La mesa no asume adeudos de la administración anterior.</p><p class="exp">¿Quieres aportar algo de esos meses? Regístralo como pago. 🙏</p>']
  };
  function como() {
    const pas = J.meses.filter(m => !m.futuro), ex = J.extraordinaria && J.extraordinaria.monto > 0 ? J.extraordinaria : null, pend = J.agua.filter(a => !a.pagado);
    ventana("🧮 Tu cuenta", '<p class="exp" style="margin:0 0 .3rem"><b>🧾 Mantenimiento</b></p>' + L(pas.length + " × " + $0(J.cuota), $0(pas.reduce((a, m) => a + m.cuota, 0))) + L("− Registrado", $0(pas.reduce((a, m) => a + m.manto, 0))) + L("Pendiente", $0(J.debeManto)) +
      (pend.length ? '<p class="exp" style="margin:.8rem 0 .3rem"><b>💧 Agua</b></p>' + pend.map(a => L(esc(a.nombre), $0(a.cargo))).join("") : "") +
      (ex && ex.pendiente > 0.5 ? '<p class="exp" style="margin:.8rem 0 .3rem"><b>⭐ Extraordinaria</b></p>' + L(esc(ex.nombre), $0(ex.pendiente)) : "") +
      L("Debes hoy", $0(J.total), "tot") + '<p class="exp" style="margin-top:.6rem">Desde octubre 2026.</p>');
  }
  document.addEventListener("click", e => {
    if (!J) return;
    const b = e.target.closest("[data-mes],[data-agua],[data-pago],[data-info],#btnComo");
    if (!b) return;
    if (b.id === "btnComo") return como();
    if (b.dataset.mes) return detalleMes(b.dataset.mes);
    if (b.dataset.agua) return detalleAgua(+b.dataset.agua);
    if (b.dataset.pago) return detallePago(+b.dataset.pago);
    if (b.dataset.info && INFO[b.dataset.info]) { const x = INFO[b.dataset.info](); ventana(x[0], x[1]); }
  });
  const q = +new URLSearchParams(location.search).get("depto");
  if (q >= 1 && q <= 16) elegir(q); else if (depto) elegir(depto);
})();
</script>
