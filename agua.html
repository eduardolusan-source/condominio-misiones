<style>

  }

  }
  .mono { font-family: ui-monospace, "SF Mono", "Roboto Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
  .tk-cab { display: grid; grid-template-columns: auto 1fr auto; gap: 0.7rem; align-items: center; }
  .tk-logo { width: 42px; height: 42px; }
  .tk-org { font-size: 0.78rem; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase; line-height: 1.3; }
  .tk-org span { display: block; font-weight: 500; color: var(--tk-tenue); letter-spacing: 0.05em; }
  .tk-depto { text-align: center; border: 2px solid var(--tk-tinta); border-radius: 10px; padding: 0.2rem 0.6rem 0.3rem; line-height: 1; }
  .tk-depto small { display: block; font-size: 0.6rem; font-weight: 800; letter-spacing: 0.14em; color: var(--tk-tenue); margin-bottom: 0.15rem; }
  .tk-depto b { font-size: 1.65rem; font-weight: 900; }
  .tk-mes { font-family: Georgia, "Times New Roman", serif; font-size: 1.7rem; line-height: 1.1; margin: 1rem 0 0.15rem; padding-right: 8.2rem; }
  .tk-periodo { color: var(--tk-tenue); font-size: 0.88rem; padding-right: 8rem; }
  .tk-sello { position: absolute; top: 5.5rem; right: 0.9rem; transform: rotate(-9deg); border: 3px solid currentColor; border-radius: 10px; padding: 0.35rem 0.55rem 0.3rem; font-size: 0.84rem; font-weight: 900; letter-spacing: 0.13em; line-height: 1.05; text-align: center; opacity: 0.9; box-shadow: inset 0 0 0 2px var(--tk-papel), inset 0 0 0 3px currentColor; }
  .tk-sello small { display: block; font-size: 0.62rem; letter-spacing: 0.06em; font-weight: 700; margin-top: 0.15rem; }
  .tk-sello.pagado { color: #1e7b34; } .tk-sello.porpagar { color: #b06400; } .tk-sello.espera { color: #7b776d; }
  @media (prefers-color-scheme: dark) { .tk-sello.pagado { color: #6ad38a; } .tk-sello.porpagar { color: #f2b45a; } .tk-sello.espera { color: #a9a395; } }
  .tk-etq { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--tk-tenue); margin: 1.2rem 0 0.5rem; }

  .odo small { font-size: 0.78rem; color: var(--tk-tenue); }
  .tk-flecha { font-size: 1.4rem; color: var(--tk-tenue); padding-top: 0.45rem; }

  .tk-gotas { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin: 0.8rem 0 0.2rem; min-height: 22px; }
  .tk-gotas svg { width: 15px; height: 21px; fill: var(--tk-agua); }

  .tk-litros b { font-size: 1.2rem; }
  .tk-corte { border-top: 2px dashed var(--tk-linea); margin: 1.1rem -0.3rem 0.6rem; }

  .tk-ic.com { background: color-mix(in srgb, var(--tk-com) 17%, transparent); } .tk-ic.com svg { fill: var(--tk-com); }
  .tk-txt b { display: block; font-size: 1.07rem; }
  .tk-txt small { display: block; color: var(--tk-tenue); font-size: 0.86rem; line-height: 1.3; }
  .tk-monto { font-weight: 800; font-size: 1.18rem; font-variant-numeric: tabular-nums; }
  .tk-barra { display: flex; height: 11px; border-radius: 999px; overflow: hidden; margin: 0.7rem 0 0.3rem; background: var(--tk-linea); }

  .tk-barra .a { background: linear-gradient(90deg, var(--tk-agua2), var(--tk-agua)); }
  .tk-barra .c { background: var(--tk-com); }
  .tk-barra-txt { display: flex; justify-content: space-between; gap: 0.5rem; font-size: 0.8rem; color: var(--tk-tenue); }
  .tk-corte.doble { border-top: 3px double var(--tk-linea); margin-top: 0.9rem; }

  .tk-limite b { color: var(--tk-tinta); }

    background: repeating-linear-gradient(90deg, var(--tk-tinta) 0 2px, transparent 2px 4px, var(--tk-tinta) 4px 5px, transparent 5px 8px, var(--tk-tinta) 8px 11px, transparent 11px 12px, var(--tk-tinta) 12px 13px, transparent 13px 17px, var(--tk-tinta) 17px 19px, transparent 19px 20px); }

  /* ---------- El tinaco del edificio ---------- */
  .edif { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem 1.1rem 1rem; box-shadow: var(--shadow); margin: 1.6rem 0 1rem; }
  .edif h2 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 1.45rem; margin: 0 0 0.3rem; }
  .edif .tq-dibujo { max-width: 390px; margin: 0 auto; }
  .edif-ley { list-style: none; padding: 0; margin: 0.4rem 0 0.8rem; display: grid; gap: 0.4rem; }
  .edif-ley li { display: grid; grid-template-columns: 14px 1fr auto; gap: 0.6rem; align-items: center; font-size: 0.97rem; color: var(--ink-2); }
  .edif-ley li b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .edif-ley li small { display: block; font-size: 0.82rem; }
  .edif-ley i { width: 14px; height: 14px; border-radius: 4px; display: block; }
  .edif-ley i.tu { background: #1f6fc5; } .edif-ley i.otros { background: #86c2f0; } .edif-ley i.com { background: #6cc28c; }
  @media (prefers-color-scheme: dark) { .edif-ley i.tu { background: #8cc4f4; } .edif-ley i.otros { background: #2f6ca5; } .edif-ley i.com { background: #3f8f5c; } }
  .edif details { margin-top: 0.8rem; }
  .edif summary { cursor: pointer; font-weight: 700; color: var(--accent); font-size: 0.97rem; }
  .cuentas { width: 100%; border-collapse: collapse; margin-top: 0.5rem; font-size: 0.93rem; }
  .cuentas td { padding: 0.35rem 0; border-bottom: 1px dashed var(--grid); color: var(--ink-2); vertical-align: top; }
  .cuentas td:last-child { text-align: right; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; padding-left: 0.8rem; }

  /* ---------- Recibos anteriores (solo los meses que se cobraron con lecturas) ---------- */
  .hist-tit { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 1.3rem; margin: 1.8rem 0 0.6rem; }
  .hist { display: grid; gap: 0.6rem; }
  .hist details { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
  .hist summary { list-style: none; display: grid; grid-template-columns: 1fr auto auto; gap: 0.8rem; align-items: center; padding: 0.8rem 1rem; cursor: pointer; }
  .hist summary::-webkit-details-marker { display: none; }
  .hist .hm { font-weight: 700; } .hist .hm small { display: block; font-weight: 500; color: var(--ink-2); font-size: 0.86rem; }

  .mini-sello.pagado { color: #1e7b34; } .mini-sello.porpagar { color: #b06400; } .mini-sello.espera { color: #7b776d; }
  @media (prefers-color-scheme: dark) { .mini-sello.pagado { color: #6ad38a; } .mini-sello.porpagar { color: #f2b45a; } }
  .hist details[open] { padding-bottom: 1rem; }
  .hist details .tk-envoltura { margin: 0.2rem 0.7rem 0; }
  @media (max-width: 420px) { .tk-mes { font-size: 1.45rem; } }
  @media (max-width: 380px) { .tk { padding-left: 1rem; padding-right: 1rem; } .odo .dig span { width: 1.3rem; height: 1.85rem; font-size: 1.15rem; } .tk-total strong { font-size: 2.2rem; } }

<main class="agua">
  <h1>Mi recibo de agua</h1>
  <p class="lead">Toca tu departamento.</p>
  <div class="deptos" id="deptos"></div>
  <div id="contenido"></div>

<script src="js/tinaco.js?v=20261109"></script>
<script>
/* ===== CONFIGURACIÓN ===== */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0qO7rHUmBqUJOuwjBkYIu4O8_FrWlC8f_DyLj3DrhN1h5ApHpdfKVmUgx_aVH3aJ-/exec";
const UNIDADES = 16;
/* ========================= */
const $ = id => document.getElementById(id);
const NOMBRES_MES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const r2 = x => Number(Math.round(Number(x + "e2")) + "e-2");          // como ROUND(x, 2) de la hoja
const fmt = n => "$" + Number(n || 0).toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt0 = n => "$" + Math.round(Number(n || 0)).toLocaleString("es-MX");
const m3 = v => (Math.round(v * 10) / 10).toLocaleString("es-MX") + " m³";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function nombreMes(id) { const [y, m] = id.split("-"); return NOMBRES_MES[+m - 1].replace(/^./, c => c.toUpperCase()) + " " + y; }
/* La lectura de un mes cobra el agua del mes anterior: la del 9 de noviembre es el agua de octubre. */
function mesDelAgua(id) { const [y, m] = id.split("-").map(Number); const d = new Date(y, m - 2, 1); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
function fechaLarga(s) {                                  // "2026-11-24" o "24/11/2026" → "24 de noviembre"
  let p = String(s || "").split(/[-/]/);
  if (p.length !== 3) return "";
  const [d, m] = p[0].length === 4 ? [+p[2], +p[1]] : [+p[0], +p[1]];
  return d + " de " + NOMBRES_MES[m - 1];
}
function fechaCorta(s) { const p = String(s || "").split("/"); return p.length >= 2 ? +p[0] + " " + NOMBRES_MES[+p[1] - 1].slice(0, 3) : ""; }
const GOTA = '<svg viewBox="0 0 12 17" aria-hidden="true"><path d="M6 0C6 0 0 7.4 0 11a6 6 0 0 0 12 0C12 7.4 6 0 6 0Z"/></svg>';
const HOJA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 3.5C11 3.6 5.2 7.7 4.4 15.1c-.1.8 0 1.6.2 2.4L2.3 20.3l1.4 1.4 2.6-2.6c.8.3 1.7.4 2.6.3C16 18.6 20.4 12.7 20.5 3.5Zm-12 13.2-.5-.1c2.2-3.6 5-6.3 8.2-8.1-2.7 2.3-5 5-6.9 8.1-.3 0-.5.1-.8.1Z"/></svg>';

/* El recibo del mes tal como lo entrega el script; si es la versión anterior, se completa igual. */
function normaliza(rec) {
  if (!rec) return null;
  const r = Object.assign({}, rec);
  if (r.precioMedido === undefined) {
    r.viejo = true; r.precioMedido = r.precio; r.factor = 1; r.general = 0; r.minComunes = null;
    r.comunes = Math.max(0, Number(r.comunes) || 0); r.base = Math.max(r.m3 || 0, r.suma || 0);
  }
  return r;
}
function digitos(n) {
  const s = String(Math.round(Number(n) || 0)).padStart(4, "0");
  return '<span class="dig mono">' + s.split("").map(c => "<span>" + c + "</span>").join("") + "</span>";
}

let depto = null;
const deptos = $("deptos");
for (let i = 1; i <= UNIDADES; i++) { const b = document.createElement("button"); b.type = "button"; b.textContent = i; b.dataset.n = i; b.setAttribute("aria-label", "Depto " + i); b.onclick = () => elegir(i); deptos.appendChild(b); }
function elegir(n) {
  depto = n; [...deptos.children].forEach(x => x.classList.toggle("sel", +x.dataset.n === n));
  try { localStorage.setItem("misiones_depto", n); } catch (e) {}
  cargar(n);
}

/* ---------- El ticket de un mes ---------- */
function ticket(m, prev) {
  const rec = normaliza(m.recibo);
  const hay = m.cargo !== null && rec && rec.monto > 0;
  const parejo = rec && !(rec.suma > 0);                  // primer mes: nadie tenía lectura anterior
  const base = /l[ií]nea de base/i.test(m.nota) && !(m.consumo > 0);
  const folio = (String(m.nota).match(/Pago (P-\d+)/) || [])[1] || "";
  const sello = m.pagado ? '<div class="tk-sello pagado mono">PAGADO<small>' + fechaCorta(m.pagado) + (folio ? " · " + folio : "") + '</small></div>'
    : hay ? '<div class="tk-sello porpagar mono">POR PAGAR</div>'
    : '<div class="tk-sello espera mono">EN ESPERA<small>del recibo CEA</small></div>';
  const mesAgua = mesDelAgua(m.mes);
  let h = '<article class="tk" aria-label="Recibo del agua de ' + nombreMes(mesAgua).toLowerCase() + ', depto ' + depto + '">';
  h += '<header class="tk-cab"><img class="tk-logo" src="assets/mark.svg" alt=""><div class="tk-org mono">Las Misiones<span>Recibo de agua</span></div>' +
    '<div class="tk-depto mono"><small>DEPTO</small><b>' + depto + '</b></div></header>';
  h += '<div class="tk-mes">Agua de ' + NOMBRES_MES[+mesAgua.split("-")[1] - 1] + '</div>';
  h += '<div class="tk-periodo">' + (base ? "Primera lectura del medidor" : "Lectura del " + (m.capturado || "mes")) + '</div>' + sello;

  // Medidor: de dónde a dónde, y cuánta agua es eso
  h += '<div class="tk-etq mono">Tu medidor</div><div class="tk-odos">';
  if (base) h += '<div class="odo">' + digitos(m.actual) + '<small>punto de partida</small></div>';
  else h += '<div class="odo">' + digitos(m.anterior) + '<small>' + (prev && prev.capturado ? fechaCorta(prev.capturado) : "antes") + '</small></div><div class="tk-flecha" aria-hidden="true">→</div>' +
    '<div class="odo">' + digitos(m.actual) + '<small>' + (fechaCorta(m.capturado) || "ahora") + '</small></div>';
  h += (m.estimado ? '<span class="tk-chip">lectura estimada</span>' : '') + '</div>';
  if (!base) {
    const n = Math.round(m.consumo);
    h += '<div class="tk-gotas" aria-hidden="true">' + GOTA.repeat(Math.min(n, 24)) + (n > 24 ? '<span class="mas">+' + (n - 24) + '</span>' : '') + '</div>';
    h += '<p class="tk-litros">' + (m.consumo > 0 ? '<b>' + m3(m.consumo) + '</b> = ' + Math.round(m.consumo * 1000).toLocaleString("es-MX") + ' litros, como ' + Math.round(m.consumo * 50).toLocaleString("es-MX") + ' garrafones'
      : '<b>0 m³</b> · tu medidor no se movió') + '</p>';
  }

  if (!hay) {
    h += '<div class="tk-corte"></div><div class="tk-espera">' + (m.pagado ? "Este mes ya está pagado." : "Tu lectura ya está registrada. El monto aparece en cuanto llegue el recibo de la CEA y la mesa lo capture.") + '</div>';
  } else {
    const precio = r2(rec.precioMedido);
    const com = rec.viejo ? r2(rec.comunesDepto) : r2(m.cargo - r2(m.consumo * precio));   // así los renglones suman el total exacto de la hoja
    const agua = r2(m.cargo - com);
    h += '<div class="tk-corte"></div>';
    if (parejo) {
      h += '<div class="tk-linea"><span class="tk-ic com">' + HOJA + '</span><span class="tk-txt"><b>Parte pareja del recibo</b><small>primer mes con medidores: el recibo se dividió entre los 16</small></span><span class="tk-monto">' + fmt(m.cargo) + '</span></div>';
    } else {
      h += '<div class="tk-linea"><span class="tk-ic agua">' + GOTA + '</span><span class="tk-txt"><b>Tu agua</b><small>' + (m.consumo > 0 ? m3(m.consumo) + " × " + fmt(precio) : "tu medidor no se movió") + '</small></span><span class="tk-monto">' + fmt(agua) + '</span></div>';
      h += '<div class="tk-linea"><span class="tk-ic com">' + HOJA + '</span><span class="tk-txt"><b>Áreas comunes</b><small>' + (rec.comunes > 0 ? m3(rec.comunes) + " = " + fmt(r2(com * UNIDADES)) + " entre los 16" : "entre los 16") + '</small></span><span class="tk-monto">' + fmt(com) + '</span></div>';
      const pa = m.cargo > 0 ? agua / m.cargo : 0;
      h += '<div class="tk-barra" aria-hidden="true"><i class="a" style="flex:' + Math.max(agua, 0) + '"></i><i class="c" style="flex:' + Math.max(com, 0) + '"></i></div>' +
        '<div class="tk-barra-txt"><span>agua ' + Math.round(pa * 100) + ' %</span><span>áreas comunes ' + (100 - Math.round(pa * 100)) + ' %</span></div>';
    }
    h += '<div class="tk-corte doble"></div><div class="tk-total"><span class="mono">Total</span><strong>' + fmt(m.cargo) + '</strong></div>';
    h += '<div class="tk-limite">' + (m.pagado ? "Pagado el <b>" + esc(m.pagado) + "</b>. ¡Gracias!" : (rec.limite ? "Paga antes del <b>" + fechaLarga(rec.limite) + "</b>" : "")) + '</div>';
  }
  h += '<div class="tk-codigo" aria-hidden="true"></div><div class="tk-pie mono">AGUA·' + mesAgua + '·D' + String(depto).padStart(2, "0") +
    (rec && rec.monto ? '<br>Recibo CEA ' + fmt0(rec.monto) + ' · ' + m3(rec.m3) + ' · repartido entre 16' : '') + '</div>';
  return h + '</article>';
}

/* ---------- El tinaco del edificio: el recibo lleno, con tu parte resaltada ---------- */
function edificio(m) {
  const rec = normaliza(m.recibo);
  if (!rec || !(rec.monto > 0) || !Array.isArray(m.edificio) || !window.Tinaco) return "";
  const N = r2(rec.precioMedido), H = r2(rec.comunesDepto);
  const parejo = !(rec.suma > 0);
  const capas = m.edificio.map((c, i) => ({ n: i + 1, v: c > 0 && !parejo ? r2(c * N) : 0 }));
  const comTot = parejo ? r2(m.cargo * UNIDADES) : r2(H * UNIDADES);
  const mio = capas[depto - 1].v, otros = capas.reduce((a, c) => a + c.v, 0) - mio;
  const dibujo = Tinaco.svg({ modo: "reparto", capas: capas, comunes: comTot, resaltar: depto, etiquetaTu: "Tu agua", fmt: fmt0, subir: true,
    titulo: "Recibo CEA: " + fmt0(rec.monto), aria: "El recibo de " + fmt(rec.monto) + " como un tinaco lleno: tu agua " + fmt(mio) + ", la de los otros 15 deptos " + fmt(otros) + " y áreas comunes " + fmt(comTot) + "." });
  let h = '<section class="edif"><h2>El tinaco del edificio</h2>';
  h += '<div class="tq-dibujo">' + dibujo + '</div><ul class="edif-ley">';
  if (parejo) h += '<li><i class="com"></i><span>Reparto parejo: el recibo entre 16</span><b>' + fmt(m.cargo) + ' c/u</b></li>';
  else {
    h += '<li><i class="tu"></i><span>Tu agua · depto ' + depto + '</span><b>' + fmt(mio) + '</b></li>';
    h += '<li><i class="otros"></i><span>El agua de los otros 15 deptos</span><b>' + fmt(otros) + '</b></li>';
    h += '<li><i class="com"></i><span>Áreas comunes<small>' + m3(rec.comunes) + ' · tú pones ' + fmt(H) + '</small></span><b>' + fmt(comTot) + '</b></li>';
  }
  h += '</ul>';
  h += '<details><summary>Ver las cuentas del mes</summary><table class="cuentas">' +
    '<tr><td>Recibo de la CEA' + (rec.limite ? ' · vence el ' + fechaLarga(rec.limite) : '') + '</td><td>' + fmt(rec.monto) + '</td></tr>' +
    '<tr><td>m³ del recibo</td><td>' + m3(rec.m3) + '</td></tr>' +
    (rec.general > 0 ? '<tr><td>Medidor general</td><td>' + m3(rec.general) + '</td></tr>' : '') +
    '<tr><td>Suma de los 16 medidores</td><td>' + m3(rec.suma) + '</td></tr>' +
    '<tr><td>Áreas comunes</td><td>' + m3(rec.comunes) + ' = ' + fmt(comTot) + '</td></tr>' +
    '<tr><td>Áreas comunes por depto</td><td>' + fmt(parejo ? m.cargo : H) + '</td></tr>' +
    '<tr><td>Precio por m³</td><td>' + fmt(N) + '</td></tr></table></details>';
  return h + '</section>';
}

/* ---------- Recibos anteriores: renglón con sello; al tocarlo se abre su ticket ---------- */
function anterior(m, prev) {
  const rec = normaliza(m.recibo), hay = m.cargo !== null && rec && rec.monto > 0;
  const sello = m.pagado ? '<span class="mini-sello pagado mono">PAGADO</span>' : hay ? '<span class="mini-sello porpagar mono">POR PAGAR</span>' : '<span class="mini-sello espera mono">EN ESPERA</span>';
  return '<details><summary><span class="hm">Agua de ' + nombreMes(mesDelAgua(m.mes)).toLowerCase() + '<small>' + m3(m.consumo) + '</small></span>' +
    '<span class="hmonto">' + (hay ? fmt(m.cargo) : "—") + '</span>' + sello + '</summary><div class="tk-envoltura">' + ticket(m, prev) + '</div></details>';
}

async function cargar(n) {
  const c = $("contenido");
  c.innerHTML = '<p class="pista">Buscando tu recibo…</p>';
  try {
    const r = await fetch(SCRIPT_URL + "?accion=agua&depto=" + n + "&t=" + Date.now());
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    if (!j.meses) throw new Error("servicio");
    if (n !== depto) return;                             // tocaron otro depto mientras cargaba
    /* Solo los meses con lecturas: el primero de cada medidor es su punto de partida y no se cobra. */
    const conDatos = x => x.recibo ? Number(x.recibo.suma) > 0 : !(/l[ií]nea de base/i.test(x.nota) && !(x.consumo > 0));
    const meses = j.meses.filter(conDatos);
    const previo = x => j.meses[j.meses.indexOf(x) + 1];
    if (!meses.length) { c.innerHTML = '<p class="pista">Todavía no hay recibos de agua para el depto ' + n + '.</p>'; return; }
    const m = meses[0];
    const rec = normaliza(m.recibo);
    let h = '<div class="tk-envoltura">' + ticket(m, previo(m)) + '</div>';
    if (m.cargo !== null && rec && rec.monto > 0 && !m.pagado) h += '<a class="btn primary pagar" href="pago.html?agua=' + r2(m.cargo) + '&mes=' + m.mes + '">Registrar mi pago de ' + fmt(m.cargo) + '</a>';
    h += edificio(m);
    if (meses.length > 1) h += '<h2 class="hist-tit">Tus recibos anteriores</h2><div class="hist">' + meses.slice(1).map(x => anterior(x, previo(x))).join("") + '</div>';
    c.innerHTML = h;
  } catch (e) {
    c.innerHTML = '<p class="pista">' + (String(e.message) === "servicio" ? "El servicio todavía no tiene activa la consulta de agua." : "No se pudo consultar. Intenta de nuevo.") + '</p>';
  }
}
(function () {
  let g = parseInt(new URLSearchParams(location.search).get("depto"), 10);
  if (!(g >= 1 && g <= UNIDADES)) { try { g = parseInt(localStorage.getItem("misiones_depto"), 10); } catch (e) {} }
  if (g >= 1 && g <= UNIDADES) elegir(g);
})();
</script>
